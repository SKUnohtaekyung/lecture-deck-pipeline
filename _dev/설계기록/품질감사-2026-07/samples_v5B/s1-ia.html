<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>5구간 B · 1 — 정보 구조</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../../../kit/styles/deck.css">
<link rel="stylesheet" href="../../../kit/styles/legibility.css">
<link rel="stylesheet" href="../../../kit/styles/patterns.css">
<link rel="stylesheet" href="samples.css">
</head>
<body>
<div class="deck">
  <section class="slide w5b-berg" data-slide="C5-IA">
    <header class="s-head">
      <svg class="s-logo" viewBox="0 0 96 96" aria-hidden="true"><line x1="28.8" y1="28.7" x2="49" y2="70" style="stroke:var(--mint)" stroke-width="18" stroke-linecap="round"/><line x1="70.9" y1="25.1" x2="49" y2="70" style="stroke:var(--blue)" stroke-width="19" stroke-linecap="round"/><circle cx="49" cy="70" r="9.5" style="fill:var(--ink)"/></svg><span class="s-brand">VIBECODING</span>
      <span class="s-line"></span><div class="s-team">2주차<br>5교시</div>
    </header>
    <div class="s-full">
      <h2 class="s-title">정보 구조</h2>

      <p class="lead">화면에 보이는 메뉴는 <b>빙산의 일각</b>입니다. 그 아래에 «무엇을 어디에 둘지» 정한 결정이 있습니다.</p>

      <div class="bg-body">
        <svg width="700" height="300" viewBox="0 0 700 300" role="img"
             aria-label="빙산 도해. 수면 위 작은 봉우리는 네비게이션·메뉴, 수면 아래 큰 덩어리는 무엇끼리 묶을지·어디에 둘지·어떤 순서로 둘지의 결정이다">
          <polygon points="350,16 402,84 298,84" style="fill:var(--periwinkle)"/>
          <polygon points="266,90 434,90 498,288 202,288" style="fill:var(--blue-panel); stroke:var(--blue)" stroke-width="2"/>
          <line x1="10" y1="87" x2="690" y2="87" style="stroke:var(--blue)" stroke-width="3" stroke-dasharray="12 8"/>
          <text x="16" y="76" font-size="18" font-weight="800" style="fill:var(--blue)">수면 &mdash; 여기까지가 눈에 보입니다</text>

          <text x="418" y="52" font-size="20" font-weight="800" style="fill:var(--ink)">네비게이션 · 메뉴 · 버튼</text>

          <text x="350" y="140" text-anchor="middle" font-size="21" font-weight="800" style="fill:var(--ink)">무엇끼리 묶을까</text>
          <text x="350" y="140" text-anchor="middle" font-size="21" font-weight="800" style="fill:var(--ink)" dy="34">어디에 둘까</text>
          <text x="350" y="140" text-anchor="middle" font-size="21" font-weight="800" style="fill:var(--ink)" dy="68">어떤 순서로</text>
          <text x="350" y="264" text-anchor="middle" font-size="19" font-weight="700" style="fill:var(--blue)">설명 · 입력 · 결과를 어떻게 나눌지</text>
        </svg>

        <div class="bg-side">
          <div class="bg-vs">
            <div class="a"><b>정보 구조</b><span>무엇이 어디에 — 구조</span></div>
            <div class="b"><b>사용자 흐름</b><span>어떤 순서로 움직이나 — 흐름</span></div>
          </div>
          <p class="lead">한 페이지짜리라도 «설명 먼저, 그다음 입력, 그다음 결과»처럼 <b>놓는 순서를 정하는 것</b>이 정보 구조입니다.</p>
        </div>
      </div>

      <p class="bg-note">메뉴를 어떻게 그릴까가 아니라 <span class="hl-mint-mark">보이지 않는 결정</span>이 먼저입니다 &mdash; <span class="hl-mint-underline">전문 사이트맵은 필요 없습니다.</span></p>

    </div>
  </section>
</div>
</body>
</html>
