<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>5구간 B · 3 — 화면 문구</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../../../kit/styles/deck.css">
<link rel="stylesheet" href="../../../kit/styles/legibility.css">
<link rel="stylesheet" href="../../../kit/styles/patterns.css">
<link rel="stylesheet" href="samples.css">
</head>
<body>
<div class="deck">
  <section class="slide w5b-cards" data-slide="C5-COPY">
    <header class="s-head">
      <svg class="s-logo" viewBox="0 0 96 96" aria-hidden="true"><line x1="28.8" y1="28.7" x2="49" y2="70" style="stroke:var(--mint)" stroke-width="18" stroke-linecap="round"/><line x1="70.9" y1="25.1" x2="49" y2="70" style="stroke:var(--blue)" stroke-width="19" stroke-linecap="round"/><circle cx="49" cy="70" r="9.5" style="fill:var(--ink)"/></svg><span class="s-brand">VIBECODING</span>
      <span class="s-line"></span><div class="s-team">2주차<br>5교시</div>
    </header>
    <div class="s-full">
      <h2 class="s-title">화면 문구</h2>

      <p class="lead">버튼·라벨·오류 — 세 자리에서 문구가 갈립니다.</p>

      <div class="cd-grid">
        <div class="cd-card">
          <span class="cd-k">버튼</span>
          <div class="cd-x"><b>확인</b><span>누르면 무슨 일이 일어나는지 알 수 없다</span></div>
          <div class="cd-o"><b>기록하기</b><span>버튼이 하는 일을 그대로 적는다</span></div>
        </div>
        <div class="cd-card">
          <span class="cd-k">라벨</span>
          <div class="cd-x"><b>입력</b><span>무엇을 넣으라는지 모른다</span></div>
          <div class="cd-o"><b>무엇을 했나요?</b><span>넣을 것을 묻는다</span></div>
        </div>
        <div class="cd-card">
          <span class="cd-k">오류</span>
          <div class="cd-x"><b>오류 발생</b><span>문제만 말하고 사용자를 탓한다</span></div>
          <div class="cd-o"><b>활동 내용을 한 줄 적어 주세요</b><span>무엇을·어떻게 고칠지 함께</span></div>
        </div>
      </div>

      <p class="cd-rule">버튼은 <span class="hl-mint-mark">하는 일을 말한다</span> — 오류는 <span class="hl-mint-underline">고치는 법까지</span> 한 줄로 알려 줍니다.</p>

    </div>
  </section>
</div>
</body>
</html>
