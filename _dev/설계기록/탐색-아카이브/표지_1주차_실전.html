<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280">
  <title>1주차 · AI와 협업해 첫 웹페이지 만들기 — 바이브코딩</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <!-- ▼ 실제 킷 CSS(방금 갱신된 deck.css) — 캐시버스트 ?v= 필수 -->
  <link rel="stylesheet" href="kit/styles/deck.css?v=20260713a">
  <link rel="stylesheet" href="kit/styles/legibility-40s.css?v=20260713a">
  <link rel="stylesheet" href="kit/styles/patterns.css?v=20260713a">
  <style id="kit-additions">
  </style>
</head>
<body>
  <div class="deck">

    <!-- ============ 표지 · 1주차 실전 (라이트 M3) ============ -->
    <section class="slide cover is-active" data-slide="S01">
      <span class="cover-tick tl" aria-hidden="true"></span><span class="cover-tick br" aria-hidden="true"></span>
      <header class="s-head cover-head">
        <svg class="s-logo" viewBox="0 0 96 96" aria-hidden="true"><line x1="28.8" y1="28.7" x2="49" y2="70" style="stroke:var(--mint)" stroke-width="18" stroke-linecap="round"/><line x1="70.9" y1="25.1" x2="49" y2="70" style="stroke:var(--blue)" stroke-width="19" stroke-linecap="round"/><circle cx="49" cy="70" r="9.5" style="fill:var(--ink)"/></svg>
        <div class="brand-stack">
          <span class="s-brand">바이브코딩</span>
          <span class="track">3-WEEK ACADEMY</span>
        </div>
        <div class="s-team">WEEK 01 / 06</div>
      </header>
      <div class="cover-meta">WEEK_01 · AI에게 이렇게 요청합니다</div>
      <div class="cover-prompt">&gt;_</div>
      <div class="cover-title">
        <h1 class="ko">AI와 협업해<br>첫 웹페이지 만들기<span class="cur" aria-hidden="true"></span></h1>
      </div>
      <div class="cover-outcome"><span class="ok" aria-hidden="true">✓</span>오늘 끝나면, 나만의 자기소개 웹페이지가 완성됩니다.</div>
      <div class="cover-presenter">발표자 이름</div>
    </section>

  </div>

  <!-- 표지 전용 PDF 버튼 (불변요소) -->
  <button class="dl-btn" id="dlBtn" onclick="window.print()">↓ PDF 다운로드</button>

  <script>
  (function(){
    // 발표 스케일: 뷰포트에 1280×720 맞춤 (실제 엔진의 축소판)
    function fit(){
      var s = Math.min(window.innerWidth/1280, window.innerHeight/720);
      document.documentElement.style.setProperty('--scale', s);
    }
    fit(); window.addEventListener('resize', fit);
  })();
  </script>
</body>
</html>
