<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>표본 A3 — 규칙 파일 vs 기술적 강제 (w2-figure)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../../../../../../kit/styles/deck.css">
<link rel="stylesheet" href="../../../../../../kit/styles/legibility.css">
<link rel="stylesheet" href="../../../../../../kit/styles/patterns.css">
<link rel="stylesheet" href="samples.css">
</head>
<body>
<div class="deck">
  <section class="slide w2-figure" data-slide="C4-RULE">
    <header class="s-head">
      <svg class="s-logo" viewBox="0 0 96 96" aria-hidden="true"><line x1="28.8" y1="28.7" x2="49" y2="70" style="stroke:var(--mint)" stroke-width="18" stroke-linecap="round"/><line x1="70.9" y1="25.1" x2="49" y2="70" style="stroke:var(--blue)" stroke-width="19" stroke-linecap="round"/><circle cx="49" cy="70" r="9.5" style="fill:var(--ink)"/></svg><span class="s-brand">VIBECODING</span>
      <span class="s-line"></span><div class="s-team">2주차<br>4교시</div>
    </header>
    <div class="s-full">
      <div class="fg-text">
        <h2 class="s-title">규칙 파일 vs 기술적 강제</h2>

        <div class="fg-cards">
          <div class="fg-card"><b>규칙 파일은 맥락입니다</b><span>적어 두면 <span class="hl-mint-text">참고는 하지만</span>, 그것만으로 실행이 멈추지는 않습니다</span></div>
          <div class="fg-card"><b>안심하는 순간이 위험합니다</b><span>지시가 모호하거나 다른 지시와 부딪히면 <span class="hl-mint-underline">그냥 지나갈 수 있습니다</span></span></div>
          <div class="fg-card"><b>도구가 부실해서가 아닙니다</b><span>만든 쪽도 막으려면 다른 층을 쓰라고 안내합니다 — 애초에 용도가 다릅니다</span></div>
        </div>

        <p class="fg-strip"><span class="hl-mint-mark">되돌릴 수 있으면 규칙, 없으면 장치</span></p>
      </div>

      <div class="fg-fig">
        <div class="fg-lane fg-soft">
          <h4>규칙 파일에 적은 것</h4>
          <p>&ldquo;작업 폴더 밖은 건드리지 말아 줘&rdquo;</p>
        </div>
        <div class="fg-gate" aria-label="여기서는 막히지 않는다">
          <span></span><b>안 막힘</b><span></span>
        </div>
        <div class="fg-lane fg-hard">
          <h4>승인·권한 설정</h4>
          <p>폴더 밖 수정은 실행 전에 <b>멈추고 물어봅니다</b></p>
        </div>
        <div class="fg-gate" aria-label="여기서 실제로 막힌다" style="--x:1">
          <span style="background:var(--mint)"></span><b style="color:var(--mint-deep)">여기서 막힘</b><span style="background:var(--mint)"></span>
        </div>
      </div>
    </div>
  </section>
</div>
</body>
</html>
