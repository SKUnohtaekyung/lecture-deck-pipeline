<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>5구간 B · 4 — 기본 가독성·접근성</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../../../../../../kit/styles/deck.css">
<link rel="stylesheet" href="../../../../../../kit/styles/legibility.css">
<link rel="stylesheet" href="../../../../../../kit/styles/patterns.css">
<link rel="stylesheet" href="samples.css">
</head>
<body>
<div class="deck">
  <section class="slide w5b-a11y" data-slide="C5-A11Y">
    <header class="s-head">
      <svg class="s-logo" viewBox="0 0 96 96" aria-hidden="true"><line x1="28.8" y1="28.7" x2="49" y2="70" style="stroke:var(--mint)" stroke-width="18" stroke-linecap="round"/><line x1="70.9" y1="25.1" x2="49" y2="70" style="stroke:var(--blue)" stroke-width="19" stroke-linecap="round"/><circle cx="49" cy="70" r="9.5" style="fill:var(--ink)"/></svg><span class="s-brand">VIBECODING</span>
      <span class="s-line"></span><div class="s-team">2주차<br>5교시</div>
    </header>
    <div class="s-full">
      <h2 class="s-title">기본 가독성·접근성</h2>

      <p class="lead">색이 안 보이는 눈에는 이렇게 보입니다 — 오른쪽만 뜻이 남습니다.</p>

      <div class="ay-body">
        <div>
          <span class="ay-cap">색만으로 구분했을 때</span>
          <div class="ay-box">
            <div class="ay-row"><span class="ay-dot ok"></span>저장</div>
            <div class="ay-row"><span class="ay-dot no"></span>저장</div>
          </div>
          <div class="ay-box ay-gray" style="margin-top:7px">
            <div class="ay-row"><span class="ay-dot ok"></span>저장</div>
            <div class="ay-row"><span class="ay-dot no"></span>저장</div>
          </div>
          <p class="cm-why" style="margin-top:7px;font-size:17px">아래가 색각 이상 시야 &mdash; <b>둘이 같아 보입니다.</b></p>
        </div>

        <div>
          <span class="ay-cap"><span class="hl-mint-mark">색 옆에 글자</span>를 함께 두면</span>
          <div class="ay-box">
            <div class="ay-row"><span class="ay-dot ok"></span>저장됨</div>
            <div class="ay-row"><span class="ay-dot no"></span>다시 입력</div>
          </div>
          <div class="ay-box ay-gray" style="margin-top:7px">
            <div class="ay-row"><span class="ay-dot ok"></span>저장됨</div>
            <div class="ay-row"><span class="ay-dot no"></span>다시 입력</div>
          </div>
          <p class="ay-txt weak">대비가 낮은 글자 &mdash; 읽기 어렵습니다</p>
          <p class="ay-txt strong">대비가 뚜렷한 글자 &mdash; 잘 읽힙니다</p>
        </div>

        <div class="ay-stat">
          <span class="n">83.9%</span>
          <span class="d">상위 100만 홈페이지에서 <b>가장 흔한 실패</b>는 낮은 대비였습니다</span>
          <span class="ay-track"><span class="ay-fill" style="width:83.9%"></span></span>
          <span class="d" style="margin-top:10px">입력창 라벨 누락이 51%로 그다음입니다</span>
        </div>
      </div>

      <p class="ay-band">색은 쓰되, 색만으로는 말하지 않습니다</p>

    </div>
  </section>
</div>
</body>
</html>
