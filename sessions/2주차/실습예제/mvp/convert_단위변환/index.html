<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>걸음 수 거리 환산기</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="card">
    <h1>걸음 수 거리 환산기</h1>
    <p class="desc">오늘 걸은 걸음 수를 입력하면 대략적인 거리로 바꿔 드립니다. (걸음 한 번을 0.7m로 계산)</p>

    <div class="field">
      <label for="steps">걸음 수</label>
      <input type="number" id="steps" placeholder="예: 6000" min="0" />
      <button id="convert-button" type="button">거리로 변환하기</button>
    </div>

    <section class="result">
      <h2>변환 결과</h2>
      <p id="result-text">걸음 수를 입력하고 변환하기를 눌러 보세요.</p>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
