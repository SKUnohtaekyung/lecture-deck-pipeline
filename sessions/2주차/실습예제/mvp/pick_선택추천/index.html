<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 점심 메뉴 추천</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="card">
    <h1>오늘 점심 메뉴 추천</h1>
    <p class="desc">먹고 싶은 종류를 고르면 그 종류의 메뉴 중 하나를 추천해 드려요.</p>

    <div class="field">
      <label for="type-select">메뉴 종류</label>
      <select id="type-select">
        <option value="">종류를 선택하세요</option>
        <option value="한식">한식</option>
        <option value="중식">중식</option>
        <option value="일식">일식</option>
        <option value="양식">양식</option>
        <option value="분식">분식</option>
      </select>
      <button id="recommend-button" type="button">추천받기</button>
    </div>

    <section class="result">
      <h2>추천 결과</h2>
      <p id="pick">—</p>
      <ul id="menu-list"></ul>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
