<!-- kit 기본 마크 — 과목 브랜드가 아니다.
     색은 테마 토큰을 따르되, 이 파일이 <img>/외부 리소스로 로드되면 커스텀 속성이
     상속되지 않으므로 fallback 값(default 테마)이 쓰인다. 테마를 따르게 하려면
     이 SVG를 HTML에 «인라인»하라(kit/starter/deck-template.html의 .s-logo가 그 예).
     과목 고유 마크는 여기가 아니라 courses/<과목>/ 아래 자산으로 둔다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="강의덱 마크">
  <line x1="28.8" y1="28.7" x2="49" y2="70" stroke="var(--mint, #14B8A6)" stroke-width="18" stroke-linecap="round"/>
  <line x1="70.9" y1="25.1" x2="49" y2="70" stroke="var(--blue, #1D4ED8)" stroke-width="19" stroke-linecap="round"/>
  <circle cx="49" cy="70" r="9.5" fill="var(--ink, #141821)"/>
</svg>
