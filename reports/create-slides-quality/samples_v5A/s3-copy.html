<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>5구간 A · 3 — 화면 문구</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../../../kit/styles/deck.css">
<link rel="stylesheet" href="../../../kit/styles/legibility.css">
<link rel="stylesheet" href="../../../kit/styles/patterns.css">
<link rel="stylesheet" href="samples.css">
</head>
<body>
<div class="deck">
  <section class="slide w5-map" data-slide="C5-COPY">
    <header class="s-head">
      <svg class="s-logo" viewBox="0 0 96 96" aria-hidden="true"><line x1="28.8" y1="28.7" x2="49" y2="70" style="stroke:var(--mint)" stroke-width="18" stroke-linecap="round"/><line x1="70.9" y1="25.1" x2="49" y2="70" style="stroke:var(--blue)" stroke-width="19" stroke-linecap="round"/><circle cx="49" cy="70" r="9.5" style="fill:var(--ink)"/></svg><span class="s-brand">VIBECODING</span>
      <span class="s-line"></span><div class="s-team">2주차<br>5교시</div>
    </header>
    <div class="s-full">
      <h2 class="s-title">화면 문구</h2>

      <div class="mp-head">
        <span class="a">뜻이 흐린 문구</span><span class="m"></span><span class="b">행동이 드러나는 문구</span>
      </div>

      <div class="mp-rows">
        <div class="mp-row">
          <span class="mp-bad">확인<span>누르면 무슨 일이 일어나는지 알 수 없다</span></span>
          <span class="mp-ar">&#8594;</span>
          <span class="mp-good">기록하기<span>버튼이 하는 일을 그대로 적는다</span></span>
        </div>
        <div class="mp-row">
          <span class="mp-bad">입력<span>무엇을 넣으라는지 모른다</span></span>
          <span class="mp-ar">&#8594;</span>
          <span class="mp-good">무엇을 했나요?<span>넣을 것을 묻는다</span></span>
        </div>
        <div class="mp-row">
          <span class="mp-bad">오류: 입력값이 invalid<span>사용자를 탓하고 영어로 말한다</span></span>
          <span class="mp-ar">&#8594;</span>
          <span class="mp-good">활동 내용을 한 줄 적어 주세요<span>무엇을·어떻게 고칠지 함께</span></span>
        </div>
        <div class="mp-row">
          <span class="mp-bad">처리되었습니다<span>무엇이 어떻게 됐는지 없다</span></span>
          <span class="mp-ar">&#8594;</span>
          <span class="mp-good">오늘 기록에 추가됐어요<span>결과를 눈에 보이게</span></span>
        </div>
      </div>

      <p class="mp-rule"><span class="hl-mint-mark">버튼은 하는 일을 말한다</span> — 오류는 문제만 말하지 말고 <span class="hl-mint-underline">고치는 법까지</span> 한 줄로 알려 줍니다.</p>

    </div>
  </section>
</div>
</body>
</html>
