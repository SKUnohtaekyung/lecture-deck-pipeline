<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>5구간 A · 6 — 디자인 시스템·토큰</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../../../kit/styles/deck.css">
<link rel="stylesheet" href="../../../kit/styles/legibility.css">
<link rel="stylesheet" href="../../../kit/styles/patterns.css">
<link rel="stylesheet" href="samples.css">
</head>
<body>
<div class="deck">
  <section class="slide w5-hub" data-slide="C5-TOKEN">
    <header class="s-head">
      <svg class="s-logo" viewBox="0 0 96 96" aria-hidden="true"><line x1="28.8" y1="28.7" x2="49" y2="70" style="stroke:var(--mint)" stroke-width="18" stroke-linecap="round"/><line x1="70.9" y1="25.1" x2="49" y2="70" style="stroke:var(--blue)" stroke-width="19" stroke-linecap="round"/><circle cx="49" cy="70" r="9.5" style="fill:var(--ink)"/></svg><span class="s-brand">VIBECODING</span>
      <span class="s-line"></span><div class="s-team">2주차<br>5교시</div>
    </header>
    <div class="s-full">
      <h2 class="s-title">디자인 시스템·토큰</h2>

      <p class="lead">같은 값을 여러 곳에서 씁니다. 그때마다 새로 고르면 화면이 들쭉날쭉해집니다 — <span class="hl-mint-mark">한 번 정해 이름으로 부릅니다</span>.</p>

      <div class="hb-wrap">
        <svg width="880" height="300" viewBox="0 0 880 300" role="img"
             aria-label="가운데 정해 둔 이름 하나가 버튼·강조 글자·선택 항목·테두리 네 곳으로 이어진다">
          <defs>
            <marker id="mk" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
              <path d="M0 0 L9 4.5 L0 9 z" style="fill:var(--mint-deep)"/>
            </marker>
          </defs>

          <path d="M300 150 L420 60"  fill="none" style="stroke:var(--mint)" stroke-width="4" marker-end="url(#mk)"/>
          <path d="M300 150 L420 120" fill="none" style="stroke:var(--mint)" stroke-width="4" marker-end="url(#mk)"/>
          <path d="M300 150 L420 180" fill="none" style="stroke:var(--mint)" stroke-width="4" marker-end="url(#mk)"/>
          <path d="M300 150 L420 240" fill="none" style="stroke:var(--mint)" stroke-width="4" marker-end="url(#mk)"/>

          <rect x="18" y="112" width="278" height="76" rx="12"
                style="fill:var(--mint-line); stroke:var(--mint-deep)" stroke-width="3"/>
          <text x="157" y="146" text-anchor="middle" font-size="21" font-weight="800" style="fill:var(--mint-deep)">정해 둔 이름</text>
          <text x="157" y="174" text-anchor="middle" font-size="23" font-weight="800" style="fill:var(--ink)">강조색 = 초록</text>

          <rect x="432" y="36"  width="330" height="48" rx="9" style="fill:var(--white); stroke:var(--gray-400)" stroke-width="2"/>
          <text x="452" y="66"  font-size="21" font-weight="700" style="fill:var(--ink)">버튼 배경</text>
          <rect x="432" y="96"  width="330" height="48" rx="9" style="fill:var(--white); stroke:var(--gray-400)" stroke-width="2"/>
          <text x="452" y="126" font-size="21" font-weight="700" style="fill:var(--ink)">강조한 글자</text>
          <rect x="432" y="156" width="330" height="48" rx="9" style="fill:var(--white); stroke:var(--gray-400)" stroke-width="2"/>
          <text x="452" y="186" font-size="21" font-weight="700" style="fill:var(--ink)">선택된 항목 표시</text>
          <rect x="432" y="216" width="330" height="48" rx="9" style="fill:var(--white); stroke:var(--gray-400)" stroke-width="2"/>
          <text x="452" y="246" font-size="21" font-weight="700" style="fill:var(--ink)">입력창 테두리</text>

          <path d="M790 60 L790 240" fill="none" style="stroke:var(--gray-400)" stroke-width="3" stroke-dasharray="7 6"/>
          <text x="806" y="145" font-size="19" font-weight="800" style="fill:var(--gray-700)">네</text>
          <text x="806" y="168" font-size="19" font-weight="800" style="fill:var(--gray-700)">곳</text>
        </svg>
      </div>

      <p class="hb-note">초록을 파랑으로 바꾸고 싶으면 — 한 곳만 고칩니다</p>

    </div>
  </section>
</div>
</body>
</html>
