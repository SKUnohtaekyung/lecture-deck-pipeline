<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>5구간 A · 1 — 정보 구조(IA)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../../../kit/styles/deck.css">
<link rel="stylesheet" href="../../../kit/styles/legibility.css">
<link rel="stylesheet" href="../../../kit/styles/patterns.css">
<link rel="stylesheet" href="samples.css">
</head>
<body>
<div class="deck">
  <section class="slide w5-layer" data-slide="C5-IA">
    <header class="s-head">
      <svg class="s-logo" viewBox="0 0 96 96" aria-hidden="true"><line x1="28.8" y1="28.7" x2="49" y2="70" style="stroke:var(--mint)" stroke-width="18" stroke-linecap="round"/><line x1="70.9" y1="25.1" x2="49" y2="70" style="stroke:var(--blue)" stroke-width="19" stroke-linecap="round"/><circle cx="49" cy="70" r="9.5" style="fill:var(--ink)"/></svg><span class="s-brand">VIBECODING</span>
      <span class="s-line"></span><div class="s-team">2주차<br>5교시</div>
    </header>
    <div class="s-full">
      <h2 class="s-title">정보 구조</h2>

      <p class="lead">화면에 <b>보이는 것</b>은 우리가 <b>정한 것</b>의 일부입니다. 한 페이지짜리라도 정할 것은 있습니다.</p>

      <div class="ly-stack">
        <div class="ly-top">
          <span class="ly-tag">눈에 보이는 것</span>
          <div class="ly-items">
            <div><b>메뉴·버튼</b><span>화면에 실제로 놓인 요소</span></div>
            <div><b>글자와 색</b><span>보이는 표현</span></div>
            <div><b>배치</b><span>어디에 무엇이 있는지</span></div>
          </div>
        </div>

        <div class="ly-line"><b>보이는 것은 여기서 결정된다</b></div>

        <div class="ly-bot">
          <span class="ly-tag">보이지 않는 결정</span>
          <div class="ly-items">
            <div><b>무엇끼리 묶을까</b><span>설명·입력·결과를 어떻게 나눌지</span></div>
            <div><b>어디에 둘까</b><span>먼저 볼 것과 나중에 볼 것</span></div>
            <div><b>어떤 순서로</b><span>위에서 아래로 읽히는 차례</span></div>
          </div>
        </div>
      </div>

      <p class="ly-note">「메뉴를 어떻게 그릴까」가 아니라 <span class="hl-mint-mark">무엇을 어디에 둘지 정하는 일</span>입니다 — <span class="hl-mint-underline">사용자가 어떤 순서로 움직이나</span>는 또 다른 질문입니다.</p>

    </div>
  </section>
</div>
</body>
</html>
