<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>5구간 A · 2 — 화면 순서·정보 우선순위</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../../../kit/styles/deck.css">
<link rel="stylesheet" href="../../../kit/styles/legibility.css">
<link rel="stylesheet" href="../../../kit/styles/patterns.css">
<link rel="stylesheet" href="samples.css">
</head>
<body>
<div class="deck">
  <section class="slide w5-rank" data-slide="C5-ORDER">
    <header class="s-head">
      <svg class="s-logo" viewBox="0 0 96 96" aria-hidden="true"><line x1="28.8" y1="28.7" x2="49" y2="70" style="stroke:var(--mint)" stroke-width="18" stroke-linecap="round"/><line x1="70.9" y1="25.1" x2="49" y2="70" style="stroke:var(--blue)" stroke-width="19" stroke-linecap="round"/><circle cx="49" cy="70" r="9.5" style="fill:var(--ink)"/></svg><span class="s-brand">VIBECODING</span>
      <span class="s-line"></span><div class="s-team">2주차<br>5교시</div>
    </header>
    <div class="s-full">
      <h2 class="s-title">화면 순서·정보 우선순위</h2>

      <p class="lead">눈은 <b>위에서 아래로</b> 훑습니다. 그래서 순서가 곧 안내입니다 — 이 순서를 바꾸면 뜻이 깨집니다.</p>

      <div class="rk-wrap">
        <div class="rk-screen">
          <div class="rk-1">오늘의 활동 기록</div>
          <div class="rk-2">
            <span class="rk-input">무엇을 했나요?</span>
            <span class="rk-btn">기록하기</span>
          </div>
          <div class="rk-3">오늘 기록<br>· 09:20 아침 산책 30분<br>· 13:05 점심 후 정리</div>
        </div>

        <div class="rk-steps">
          <div class="rk-step"><b>① 무슨 서비스인지</b><span>제목 한 줄이 가장 크게</span></div>
          <div class="rk-step"><b>② 무엇을 입력하는지</b><span>입력창은 화면 가운데</span></div>
          <div class="rk-step"><b>③ 무엇을 누르는지</b><span>버튼은 입력창 바로 옆</span></div>
          <div class="rk-step"><b>④ 결과가 어디 나오는지</b><span>그 아래에 작게</span></div>
          <p class="rk-size">글자 크기는 <span class="hl-mint-text">3단계</span>면 충분합니다. <span class="hl-mint-mark">가장 큰 것은 하나뿐</span>일 때 그 하나가 눈에 띕니다.</p>
        </div>
      </div>

    </div>
  </section>
</div>
</body>
</html>
