<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>5구간 B · 6 — 디자인 시스템·토큰</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../../../../../../kit/styles/deck.css">
<link rel="stylesheet" href="../../../../../../kit/styles/legibility.css">
<link rel="stylesheet" href="../../../../../../kit/styles/patterns.css">
<link rel="stylesheet" href="samples.css">
</head>
<body>
<div class="deck">
  <section class="slide w5b-chain" data-slide="C5-TOKEN">
    <header class="s-head">
      <svg class="s-logo" viewBox="0 0 96 96" aria-hidden="true"><line x1="28.8" y1="28.7" x2="49" y2="70" style="stroke:var(--mint)" stroke-width="18" stroke-linecap="round"/><line x1="70.9" y1="25.1" x2="49" y2="70" style="stroke:var(--blue)" stroke-width="19" stroke-linecap="round"/><circle cx="49" cy="70" r="9.5" style="fill:var(--ink)"/></svg><span class="s-brand">VIBECODING</span>
      <span class="s-line"></span><div class="s-team">2주차<br>5교시</div>
    </header>
    <div class="s-full">
      <h2 class="s-title">디자인 시스템·토큰</h2>

      <p class="lead">값을 그때그때 새로 고르면 화면이 들쭉날쭉해집니다 — <span class="hl-mint-mark">값 → 이름 → 재사용</span> 세 걸음으로 묶습니다.</p>

      <div class="ch-wrap">
        <svg width="1080" height="286" viewBox="0 0 1080 286" role="img"
             aria-label="값 하나에 이름을 붙이고, 버튼 배경·강조 글자·선택 항목·입력창 테두리 네 곳이 그 이름을 재사용한다">
          <defs>
            <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" style="fill:var(--mint-deep)"/></marker>
          </defs>

          <text x="98"  y="30" text-anchor="middle" font-size="19" font-weight="800" style="fill:var(--gray-700)">① 값</text>
          <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="800" style="fill:var(--gray-700)">② 이름 붙이기</text>
          <text x="800" y="30" text-anchor="middle" font-size="19" font-weight="800" style="fill:var(--gray-700)">③ 여러 곳이 재사용</text>

          <rect x="18" y="112" width="160" height="66" rx="12" style="fill:var(--mint)"/>
          <text x="98" y="153" text-anchor="middle" font-size="23" font-weight="800" style="fill:var(--on-mint)">초록</text>

          <path d="M186 145 H258" fill="none" style="stroke:var(--mint-deep)" stroke-width="4" marker-end="url(#ar)"/>

          <rect x="268" y="106" width="188" height="78" rx="12"
                style="fill:var(--mint-line); stroke:var(--mint-deep)" stroke-width="3"/>
          <text x="362" y="140" text-anchor="middle" font-size="20" font-weight="800" style="fill:var(--mint-deep)">이름</text>
          <text x="362" y="168" text-anchor="middle" font-size="22" font-weight="800" style="fill:var(--ink)">강조색</text>

          <path d="M464 145 L556 62"  fill="none" style="stroke:var(--mint)" stroke-width="4" marker-end="url(#ar)"/>
          <path d="M464 145 L556 120" fill="none" style="stroke:var(--mint)" stroke-width="4" marker-end="url(#ar)"/>
          <path d="M464 145 L556 176" fill="none" style="stroke:var(--mint)" stroke-width="4" marker-end="url(#ar)"/>
          <path d="M464 145 L556 234" fill="none" style="stroke:var(--mint)" stroke-width="4" marker-end="url(#ar)"/>

          <rect x="568" y="38"  width="470" height="48" rx="9" style="fill:var(--white); stroke:var(--gray-400)" stroke-width="2"/>
          <text x="590" y="68"  font-size="21" font-weight="700" style="fill:var(--ink)">버튼 배경</text>
          <rect x="568" y="96"  width="470" height="48" rx="9" style="fill:var(--white); stroke:var(--gray-400)" stroke-width="2"/>
          <text x="590" y="126" font-size="21" font-weight="700" style="fill:var(--ink)">강조한 글자</text>
          <rect x="568" y="154" width="470" height="48" rx="9" style="fill:var(--white); stroke:var(--gray-400)" stroke-width="2"/>
          <text x="590" y="184" font-size="21" font-weight="700" style="fill:var(--ink)">선택된 항목 표시</text>
          <rect x="568" y="212" width="470" height="48" rx="9" style="fill:var(--white); stroke:var(--gray-400)" stroke-width="2"/>
          <text x="590" y="242" font-size="21" font-weight="700" style="fill:var(--ink)">입력창 테두리</text>
        </svg>
      </div>

      <p class="ch-note">초록을 파랑으로 바꾸고 싶으면 — 이름 하나만 고칩니다</p>

    </div>
  </section>
</div>
</body>
</html>
