<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>활동 기록장</title>
  <!-- 복구: CSS 를 프로젝트 안 상대경로로 가리킨다. -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <!-- 복구: 이미지를 프로젝트 안 assets/ 상대경로로 가리킨다. -->
      <img class="logo" src="assets/logo.svg" alt="앵커 로고" width="48" height="48">
      <h1>활동 기록장</h1>
    </header>
    <p class="desc">오늘 한 활동을 적어 기록으로 남겨 보세요.</p>
    <div class="input-row">
      <input id="activityInput" type="text" placeholder="예: 30분 산책하기">
      <button id="addButton">기록 추가</button>
    </div>
    <ul id="logList" class="log-list"></ul>
    <p id="emptyMsg" class="empty">아직 기록이 없어요.</p>
  </main>
  <script src="./script.js"></script>
</body>
</html>
