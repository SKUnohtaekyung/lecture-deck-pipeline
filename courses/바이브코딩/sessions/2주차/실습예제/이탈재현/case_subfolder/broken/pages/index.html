<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>활동 기록장</title>
  <!-- 범위 이탈: index.html 이 pages/ 안에 있고, 경로를 ../ 로 잘못 가리킨다. -->
  <!-- style.css / script.js 는 이 파일과 같은 pages/ 폴더에 있는데 ../ 로 부모를 찾아 못 만난다. -->
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main class="app">
    <h1>활동 기록장</h1>
    <p class="desc">오늘 한 활동을 적어 기록으로 남겨 보세요.</p>
    <div class="input-row">
      <input id="activityInput" type="text" placeholder="예: 30분 산책하기">
      <button id="addButton">기록 추가</button>
    </div>
    <ul id="logList" class="log-list"></ul>
    <p id="emptyMsg" class="empty">아직 기록이 없어요.</p>
  </main>
  <script src="../script.js"></script>
</body>
</html>
