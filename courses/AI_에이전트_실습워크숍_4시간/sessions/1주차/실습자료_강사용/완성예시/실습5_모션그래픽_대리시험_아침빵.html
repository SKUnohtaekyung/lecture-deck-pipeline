<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아침빵 30초 영상</title>
<style>
/* 색 · 글꼴 · 글자 크기는 design.md의 값입니다. 색 코드는 이 :root에만 둡니다. */
:root{
  --bg:#FBF3E4;      /* 바탕 60 */
  --ink:#5A3A24;     /* 보조 30 */
  --accent:#C8702A;  /* 강조 10 */
  --safe-l:108px; --safe-r:972px; --safe-t:240px; --safe-b:1600px;
  --txt-top:500px; --art-top:1040px; --art-h:420px;
  --fs-hook:112px; --fs-main:100px; --fs-cta:116px; --fs-ctasub:66px;
  --font:"NanumSquareRound","Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --ctl-h:112px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}
#wrap{position:fixed;left:0;top:0;right:0;bottom:var(--ctl-h);display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:calc(1080px * var(--s,0.3));height:calc(1920px * var(--s,0.3));box-shadow:0 0 0 2px color-mix(in srgb,var(--ink) 18%,transparent)}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform:scale(var(--s,0.3));transform-origin:0 0;background:var(--bg);overflow:hidden}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0;visibility:hidden}
.txt{position:absolute;left:var(--safe-l);width:calc(var(--safe-r) - var(--safe-l));top:var(--txt-top);text-align:center}
.ln{margin:0;line-height:1.35;font-weight:700;opacity:0;word-break:keep-all;overflow-wrap:break-word;-webkit-text-stroke:1.5px currentColor}
.ln.hook{font-size:var(--fs-hook)}
.ln.main{font-size:var(--fs-main)}
.ln.cta{font-size:var(--fs-cta)}
.ln.ctasub{font-size:var(--fs-ctasub);margin-top:36px}
.u{position:relative}
.u::after{content:"";position:absolute;left:0;right:0;bottom:-0.04em;height:0.075em;border-radius:99px;background:var(--accent);transform:scaleX(var(--u,0));transform-origin:left center}
.art{position:absolute;left:var(--safe-l);width:calc(var(--safe-r) - var(--safe-l));top:var(--art-top);height:var(--art-h);display:flex;align-items:center;justify-content:center;opacity:0}
.art svg{max-width:100%;max-height:100%;overflow:visible}
.f-acc{fill:var(--accent)}
.f-ink{fill:var(--ink)}
.f-bg{fill:var(--bg)}
.s-ink{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
.s-acc{fill:none;stroke:var(--accent);stroke-linecap:round;stroke-linejoin:round}
#ctl{position:fixed;left:0;right:0;bottom:0;height:var(--ctl-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px 12px}
#ctl .row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
#ctl button{font:inherit;font-size:20px;font-weight:700;padding:12px 24px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);cursor:pointer}
#ctl button:disabled{opacity:.45;cursor:default}
#msg{margin:0;min-height:1.4em;font-size:16px;text-align:center}
/* 녹화 중: 단추와 안내 줄을 화면에서 숨기고 무대를 창 전체에 맞춥니다 */
body.recording #ctl{visibility:hidden}
body.recording #wrap{bottom:0}
body.recording #frame{box-shadow:none}
</style>
</head>
<body>
<div id="wrap"><div id="frame"><div id="stage"></div></div></div>
<div id="ctl">
  <div class="row">
    <button id="btn-play" type="button">재생</button>
    <button id="btn-replay" type="button">다시 재생</button>
    <button id="btn-save" type="button">영상 파일로 저장</button>
  </div>
  <p id="msg" role="status"></p>
</div>

<!-- 빵 모양 도형: 도형과 코드로만 그립니다(그림 파일 없음) -->

      <path class="s-ink" stroke-width="11" d="M330 128 L362 202"/><path class="s-ink" stroke-width="11" d="M425 128 L457 202"/>

<template id="art-route">
  <svg viewBox="0 0 864 420" role="img" aria-label="역에서 가게까지 이어지는 선">

    <g transform="translate(620 40) scale(0.45)">
      <path class="f-acc" d="M40 215 C40 95 170 30 290 40 C420 52 490 130 480 215 C472 285 380 312 260 312 C140 312 40 290 40 215 Z"/>
      <path class="s-ink" stroke-width="12" d="M160 85 C190 140 185 230 140 290"/>
      <path class="s-ink" stroke-width="12" d="M270 62 C300 130 298 235 262 308"/>
      <path class="s-ink" stroke-width="12" d="M385 80 C410 140 405 230 372 296"/>
    </g>
  </svg>
</template>
<template id="art-trio">
  <svg viewBox="0 0 864 260" role="img" aria-label="빵 모양 도형 세 개">
    <g transform="translate(10 50) scale(0.5)">
      <path class="f-acc" d="M40 215 C40 95 170 30 290 40 C420 52 490 130 480 215 C472 285 380 312 260 312 C140 312 40 290 40 215 Z"/>
      <path class="s-ink" stroke-width="14" d="M160 85 C190 140 185 230 140 290"/>
      <path class="s-ink" stroke-width="14" d="M270 62 C300 130 298 235 262 308"/>
      <path class="s-ink" stroke-width="14" d="M385 80 C410 140 405 230 372 296"/>
    </g>
    <g transform="translate(300 50) scale(0.5)">
      <ellipse class="f-acc" cx="260" cy="175" rx="215" ry="140"/>
      <path class="s-ink" stroke-width="14" d="M150 105 Q180 150 205 215"/>
      <path class="s-ink" stroke-width="14" d="M240 80 Q270 150 295 220"/>

    <g transform="translate(590 90) rotate(-14 130 70) scale(0.5)">

<script type="application/json" id="scenes">
{
  "config": {"transition": 0.8, "enter": 0.9, "underline": 0.7, "route": 1.2},
  "scenes": [
    {"zone": "훅", "dur": 3, "art": "roll", "artAt": 0.3, "lines": [
      {"role": "hook", "enter": "스며듦", "at": 0.0, "segs": [{"t": "출근길,"}]},
      {"role": "hook", "enter": "스며듦", "at": 0.2, "segs": [{"t": "갓 구운 빵 냄새", "u": 1}]}
    ]},
    {"zone": "맥락", "dur": 5, "art": "loaf", "artAt": 0.5, "lines": [
      {"role": "main", "enter": "떠오름", "at": 0.5, "segs": [{"t": "출근길 아침,"}]},
      {"role": "main", "enter": "떠오름", "at": 1.1, "segs": [{"t": "어디서 챙기세요?"}]}
    ]},
    {"zone": "본문", "dur": 4, "art": "roll", "artAt": 0.5, "lines": [
      {"role": "main", "enter": "떠오름", "at": 0.5, "segs": [{"t": "아침빵 대표 메뉴"}]},
      {"role": "main", "enter": "떠오름", "at": 1.1, "segs": [{"t": "소금빵", "u": 1}]}
    ]},
    {"zone": "본문", "dur": 5, "art": "baguette", "artAt": 0.5, "lines": [
      {"role": "main", "enter": "떠오름", "at": 0.5, "segs": [{"t": "매일 아침"}]},
      {"role": "main", "enter": "떠오름", "at": 1.1, "segs": [{"t": "6시", "u": 1}, {"t": "에 구워요"}]}
    ]},
    {"zone": "본문", "dur": 4, "art": "route", "artAt": 0.5, "lines": [
      {"role": "main", "enter": "떠오름", "at": 0.5, "segs": [{"t": "역에서"}]},
      {"role": "main", "enter": "떠오름", "at": 1.1, "segs": [{"t": "걸어서 3분", "u": 1}]}
    ]},
    {"zone": "결말", "dur": 4, "art": "loaf", "artAt": 0.5, "lines": [
      {"role": "main", "enter": "떠오름", "at": 0.5, "segs": [{"t": "아침빵은"}]},
      {"role": "main", "enter": "떠오름", "at": 0.8, "segs": [{"t": "아침 "}, {"t": "7시", "u": 1}, {"t": "에"}]},
      {"role": "main", "enter": "떠오름", "at": 1.1, "segs": [{"t": "문을 열어요"}]}
    ]},
    {"zone": "행동 안내", "dur": 5, "art": "trio", "artAt": 0.5, "lines": [
      {"role": "cta", "enter": "떠오름", "at": 0.5, "segs": [{"t": "내일 아침"}]},
      {"role": "cta", "enter": "떠오름", "at": 1.1, "segs": [{"t": "7시", "u": 1}, {"t": "에 만나요"}]},
      {"role": "ctasub", "enter": "떠오름", "at": 1.9, "segs": [{"t": "가게 인스타그램 팔로우"}]}
    ]}
  ]
}
</script>

<script>
(function(){
  'use strict';
  var DATA = JSON.parse(document.getElementById('scenes').textContent);
  var CFG = DATA.config, SC = DATA.scenes;
  var T_TR = CFG.transition, T_EN = CFG.enter, T_UL = CFG.underline;
  var OUT_PRE = 0.3;                       // 전환 창: 장면 경계 -0.3초 ~ +0.5초
  var stage = document.getElementById('stage');
  var btnPlay = document.getElementById('btn-play');
  var btnReplay = document.getElementById('btn-replay');

  // 전체 길이는 장면 길이의 합으로 계산합니다.
  var acc = 0;
  SC.forEach(function(s){ s.start = acc; acc += s.dur; s.end = acc; });
  var TOTAL = acc;

  SC.forEach(function(s){
    var sec = document.createElement('section'); sec.className = 'scene';
    var art = document.createElement('div'); art.className = 'art';
    art.appendChild(document.getElementById('art-' + s.art).content.cloneNode(true));
    sec.appendChild(art);
    var box = document.createElement('div'); box.className = 'txt';
    s.lines.forEach(function(l){
      var p = document.createElement('p'); p.className = 'ln ' + l.role;
      l.segs.forEach(function(g){
        var sp = document.createElement('span'); sp.textContent = g.t;
        if (g.u) { sp.className = 'u'; (l.ul = l.ul || []).push(sp); }
        p.appendChild(sp);
      });
      l.el = p; box.appendChild(p);
    });
    sec.appendChild(box); stage.appendChild(sec);
    s.el = sec; s.artEl = art; s.route = art.querySelector('.route');
  });

  function clamp(x){ return x < 0 ? 0 : (x > 1 ? 1 : x); }
  function ease(x){ x = clamp(x); return 1 - Math.pow(1 - x, 3); }

  // 겹쳐넘기기: 이전 장면이 옅어지며 새 장면이 겹쳐 나타납니다.
  function layerOpacity(i, t){
    var s = SC[i], o = 1;
    if (i > 0) o = Math.min(o, clamp((t - (s.start - OUT_PRE)) / T_TR));
    if (i < SC.length - 1) o = Math.min(o, 1 - clamp((t - (s.end - OUT_PRE)) / T_TR));
    return o;
  }

  function render(t){
    SC.forEach(function(s, i){
      var lo = layerOpacity(i, t);
      s.el.style.opacity = lo;
      s.el.style.visibility = lo > 0 ? 'visible' : 'hidden';
      if (lo <= 0) return;
      var rel = t - s.start, aAt = (s.artAt == null ? 0.3 : s.artAt);
      var pa = ease((rel - aAt) / T_EN);                       // 스며듦
      s.artEl.style.opacity = pa;
      s.artEl.style.filter = pa < 1 ? 'blur(' + ((1 - pa) * 10).toFixed(2) + 'px)' : 'none';
      if (s.route) {                                            // 그려짐
        var pr = ease((rel - aAt - T_EN) / CFG.route);
        s.route.style.strokeDashoffset = (1 - pr).toFixed(4);
      }
      s.lines.forEach(function(l){
        var k = ease((rel - l.at) / T_EN), st = l.el.style;
        st.opacity = k;
        if (l.enter === '떠오름') {
          st.transform = 'translateY(' + ((1 - k) * 36).toFixed(2) + 'px)'; st.filter = 'none';
        } else {
          st.transform = 'none'; st.filter = k < 1 ? 'blur(' + ((1 - k) * 10).toFixed(2) + 'px)' : 'none';
        }
        if (l.ul) {                                             // 밑줄긋기
          var u = ease((rel - l.at - T_EN - 0.15) / T_UL);
          l.ul.forEach(function(sp){ sp.style.setProperty('--u', u.toFixed(4)); });
        }
      });
    });
  }

  var t = 0, playing = false, last = 0, raf = 0, atPoster = true, onEnd = null;
  var POSTER = Math.min(2.0, TOTAL);

  function setButtons(){ btnPlay.disabled = playing; }
  function tick(now){
    if (!playing) return;
    var dt = (now - last) / 1000; last = now;
    if (dt > 0.25) dt = 0.25;
    t = Math.min(TOTAL, t + dt); render(t);
    if (t >= TOTAL) {
      playing = false; setButtons();
      if (onEnd) { var f = onEnd; onEnd = null; f(); }
      return;
    }
    raf = requestAnimationFrame(tick);
  }
  function play(){
    if (playing) return;
    if (atPoster || t >= TOTAL) t = 0;
    atPoster = false; playing = true; last = performance.now();
    render(t); setButtons(); raf = requestAnimationFrame(tick);
  }
  function replay(){ cancelAnimationFrame(raf); playing = false; t = 0; atPoster = false; play(); }

  function fit(){
    var ctl = document.getElementById('ctl');
    var rec = document.body.classList.contains('recording');
    var w = window.innerWidth, h = window.innerHeight - (rec ? 0 : ctl.offsetHeight);
    document.documentElement.style.setProperty('--s', Math.min(w / 1080, h / 1920));
  }

  // 영상 파일로 저장: 화면 공유(이 탭) → 처음부터 재생하며 녹화 → .webm 내려받기
  var FALLBACK = '안 되면 Windows 화면 녹화(Win + Alt + R)로 대신할 수 있습니다.';
  var msg = document.getElementById('msg');
  var btnSave = document.getElementById('btn-save');
  function say(s){ msg.textContent = s; }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  async function saveVideo(){
    say('');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia || typeof MediaRecorder === 'undefined') {
      say('이 브라우저는 화면 녹화를 지원하지 않습니다. ' + FALLBACK); return;
    }
    var stream;
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: false, preferCurrentTab: true });
    } catch (e) {
      say('화면 공유가 시작되지 않았습니다. ' + FALLBACK); return;
    }
    var mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].filter(function(m){ return MediaRecorder.isTypeSupported(m); })[0];
    var rec, chunks = [], finished = false;
    try { rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); }
    catch (e) { stream.getTracks().forEach(function(x){ x.stop(); }); say('녹화를 시작하지 못했습니다. ' + FALLBACK); return; }
    rec.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = function(){
      stream.getTracks().forEach(function(x){ x.stop(); });
      document.body.classList.remove('recording'); fit();
      if (finished && chunks.length) {
        var url = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
        var a = document.createElement('a'); a.href = url; a.download = '영상.webm';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 10000);
        say('영상.webm 을 내려받았습니다. 내려받기 폴더를 확인해 주세요.');
      } else {
        say('녹화가 끝까지 되지 않았습니다. ' + FALLBACK);
      }
    };
    stream.getVideoTracks()[0].addEventListener('ended', function(){ if (rec.state !== 'inactive') rec.stop(); });
    cancelAnimationFrame(raf); playing = false; t = 0; atPoster = false; render(0);
    document.body.classList.add('recording'); fit();   // 녹화 중에는 단추를 숨깁니다
    rec.start();
    await sleep(800);                                  // 공유 안내 표시가 사라질 시간
    onEnd = function(){ setTimeout(function(){ finished = true; if (rec.state !== 'inactive') rec.stop(); }, 1000); };
    play();
  }

  btnPlay.addEventListener('click', play);
  btnReplay.addEventListener('click', replay);
  btnSave.addEventListener('click', saveVideo);
  window.addEventListener('resize', fit);
  fit(); render(POSTER); setButtons();

  window.__video = { total: TOTAL, seek: function(x){ cancelAnimationFrame(raf); playing = false; atPoster = false; t = clamp(x / TOTAL) * TOTAL; render(t); setButtons(); } };
})();
</script>
</body>
</html>
