<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 캠핑 유형 테스트</title>
<style>
  /* design.md — 배경 60 · 메인 30 · 포인트 10 */
  :root{ --bg:#FFF8EE; --main:#2F4858; --point:#F26B4E; --card:#FFFFFF; --soft:#F3E9DA; --text:#22313A; --muted:#5E6B73; --r:22px; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ min-height:100vh; background:var(--bg); color:var(--text); font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; line-height:1.6; word-break:keep-all; }
  header{ display:flex; align-items:center; justify-content:space-between; max-width:1160px; margin:0 auto; padding:24px 32px 0; font-weight:800; color:var(--main); }
  header span{ padding:4px 14px; border-radius:999px; background:var(--soft); font-size:14px; font-weight:700; }
  main{ max-width:1160px; margin:0 auto; padding:32px; }
  h1{ margin:0; font-size:clamp(36px,5vw,60px); line-height:1.18; letter-spacing:-.03em; color:var(--main); }
  h2{ margin:0; font-size:clamp(24px,2.8vw,36px); line-height:1.35; letter-spacing:-.02em; color:var(--main); }
  h3{ margin:0 0 6px; font-size:15px; font-weight:800; color:var(--point); }
  p{ margin:0; font-size:18px; }
  .muted{ color:var(--muted); }
  .card{ background:var(--card); border-radius:var(--r); padding:28px 30px; box-shadow:0 10px 30px rgba(47,72,88,.09); }
  button{ font:inherit; cursor:pointer; border:0; }
  .btn{ display:inline-flex; align-items:center; padding:14px 30px; border-radius:999px; background:var(--point); color:#fff; font-size:18px; font-weight:800; transition:transform .15s, box-shadow .15s; }
  .btn:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(242,107,78,.3); }
  .btn:active{ transform:scale(.98); box-shadow:none; }
  .btn.ghost{ background:var(--soft); color:var(--main); }
  :focus-visible{ outline:3px solid var(--main); outline-offset:3px; }
  [hidden]{ display:none !important; }
  .fade{ animation:fade .35s ease both; }
  @keyframes fade{ from{ opacity:0; transform:translateY(10px); } }

  /* ① 첫 화면 */
  .hero{ display:grid; grid-template-columns:1.05fr .95fr; gap:48px; align-items:center; min-height:calc(100vh - 160px); }
  .hero p{ margin:18px 0 28px; font-size:20px; max-width:28em; }
  .faces{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .faces div{ display:grid; place-items:center; gap:4px; padding:20px 8px; border-radius:var(--r); background:var(--card); font-size:15px; font-weight:800; color:var(--main); text-align:center; }
  .faces i{ font-style:normal; font-size:40px; line-height:1.2; }
  .faces div:nth-child(odd){ transform:translateY(12px); }

  /* ② 문항 화면 */
  .quiz{ max-width:880px; margin:0 auto; padding-top:4vh; }
  .top{ display:flex; justify-content:space-between; font-size:16px; font-weight:800; color:var(--main); }
  .track{ height:10px; margin:12px 0 28px; border-radius:999px; background:var(--soft); overflow:hidden; }
  .track i{ display:block; height:100%; border-radius:999px; background:var(--point); transition:width .35s ease; }
  .opts{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:26px; }
  .opt{ padding:20px 24px; border-radius:16px; background:var(--bg); border:2px solid transparent; font-size:19px; font-weight:700; color:var(--text); text-align:left; transition:transform .15s, border-color .15s; }
  .opt:hover{ border-color:var(--point); transform:translateY(-2px); }
  .opt:active{ transform:scale(.98); }

  /* ③ 결과 화면 */
  .result{ display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
  .who{ text-align:center; }
  .who i{ display:grid; place-items:center; width:148px; height:148px; margin:0 auto 14px; border-radius:50%; background:var(--soft); font-style:normal; font-size:76px; }
  .type{ margin:2px 0 10px; font-size:clamp(32px,3.6vw,46px); font-weight:800; line-height:1.2; letter-spacing:-.03em; color:var(--point); }
  .dist{ display:grid; gap:10px; margin-top:22px; text-align:left; }
  .dist .row{ display:grid; grid-template-columns:118px 1fr 34px; gap:12px; align-items:center; font-size:15px; font-weight:700; }
  .dist .bar{ height:12px; border-radius:999px; background:var(--soft); overflow:hidden; }
  .dist .bar b{ display:block; height:100%; border-radius:999px; background:var(--main); transition:width .6s ease; }
  .dist .row.on{ color:var(--point); } .dist .row.on .bar b{ background:var(--point); }
  .side{ display:grid; gap:16px; }
  .box{ padding:20px 24px; border-radius:var(--r); background:var(--card); }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .all{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .all button{ display:grid; justify-items:center; gap:2px; padding:12px 6px; border-radius:14px; background:var(--bg); font-size:14px; font-weight:800; color:var(--main); border:2px solid transparent; transition:border-color .15s; }
  .all button i{ font-style:normal; font-size:26px; }
  .all button:hover{ border-color:var(--point); } .all button.on{ background:var(--soft); border-color:var(--main); }
  .actions{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; }

  @media (max-width:860px){
    header, main{ padding-left:18px; padding-right:18px; }
    .hero, .result, .two{ grid-template-columns:1fr; gap:20px; min-height:0; }
    .opts{ grid-template-columns:1fr; }
    .faces div:nth-child(odd){ transform:none; }
  }
</style>
</head>
<body>
<header><b>나의 캠핑 유형 테스트</b><span>재미로 보는 테스트</span></header>
<main>
  <!-- ① 첫 화면 -->
  <section id="start" class="hero fade">
    <div>
      <h1>캠핑장에서<br>나는 어떤 사람일까</h1>
      <p class="muted">문항 10개에 답하면 여섯 가지 캠핑 유형 가운데 어디에 가까운지 알려 드립니다. 2분이면 끝나고, 답은 어디에도 보내지 않습니다.</p>
      <button class="btn" id="startBtn" type="button">시작하기</button>
    </div>
    <div class="faces" id="faces" aria-hidden="true"></div>
  </section>

  <!-- ② 문항 화면 -->
  <section id="quiz" class="quiz" hidden>
    <div class="top"><span id="count" aria-live="polite"></span><span>나의 캠핑 유형 테스트</span></div>
    <div class="track" aria-hidden="true"><i id="barFill" style="width:0"></i></div>
    <div class="card" id="qcard"><h2 id="question"></h2><div class="opts" id="opts"></div></div>
  </section>

  <!-- ③ 결과 화면 -->
  <section id="result" class="result" hidden>
    <div class="card who">
      <p class="muted" id="lead">나의 캠핑 유형은</p>
      <i id="typeIcon"></i>
      <p class="type" id="typeName"></p>
      <p id="typeIntro"></p>
      <div class="dist" id="dist"></div>
    </div>
    <div class="side">
      <div class="two">
        <div class="box"><h3>잘 맞는 캠핑</h3><p id="typeGood"></p></div>
        <div class="box"><h3>조심할 것</h3><p id="typeCare"></p></div>
      </div>
      <div class="box"><h3>같이 가면 좋은 유형</h3><p id="typeBuddy"></p></div>
      <div class="box"><h3>전체 유형 보기</h3><div class="all" id="all"></div></div>
      <div class="actions"><button class="btn" id="shareBtn" type="button">공유 문구 복사</button><button class="btn ghost" id="againBtn" type="button">다시 하기</button></div>
      <p class="muted" id="shareMsg" aria-live="polite" style="font-size:15px">재미로 보는 테스트입니다. 여섯 유형 가운데 더 좋은 유형은 없습니다.</p>
    </div>
  </section>
</main>

<script>
/* prd.md 「3. 유형과 가르는 기준」 · 「5. 유형별 결과 글」 */
var TITLE = '나의 캠핑 유형 테스트';
var TYPES = {
  A:{ icon:'🎒', name:'장비 수집가', intro:'새 장비를 써 보는 것이 캠핑의 절반인 편입니다. 자리를 세팅하는 시간이 가장 즐겁습니다.', good:'차를 바로 옆에 댈 수 있는 오토캠핑장', care:'짐이 많아져 설치와 철수에 하루가 가는 것', buddy:'B' },
  B:{ icon:'🔥', name:'불멍 전문가', intro:'불 앞에 앉아 있는 시간이 가장 긴 편입니다. 장작이 타는 것을 보면 다른 일정은 필요 없습니다.', good:'장작을 쓸 수 있고 밤이 조용한 캠핑장', care:'불만 보다가 저녁을 건너뛰는 것', buddy:'C' },
  C:{ icon:'🍳', name:'요리 담당', intro:'무엇을 해 먹을지가 가장 먼저인 편입니다. 메뉴가 정해지면 캠핑 준비의 절반이 끝납니다.', good:'개수대가 가깝고 근처에 시장이 있는 캠핑장', care:'요리하느라 정작 앉아 쉬지 못하는 것', buddy:'E' },
  D:{ icon:'🗺️', name:'계획 대장', intro:'예약과 동선, 준비물 목록을 미리 끝내는 편입니다. 가는 날에는 목록대로 움직입니다.', good:'예약이 필요한 인기 캠핑장', care:'계획에 없던 일이 생기면 쉬지 못하는 것', buddy:'F' },
  E:{ icon:'😴', name:'눕는 게 일', intro:'도착하면 의자나 해먹부터 찾는 편입니다. 아무것도 하지 않는 것이 이번 캠핑의 일정입니다.', good:'그늘이 넓고 사람이 적은 캠핑장', care:'준비와 정리를 같이 간 사람에게 맡기는 것', buddy:'D' },
  F:{ icon:'🥾', name:'동네 탐험가', intro:'캠핑장 밖을 걸어 보는 편입니다. 텐트는 잠자는 곳이고, 볼 것은 동네에 있습니다.', good:'산책길과 마을이 가까운 캠핑장', care:'돌아다니다 자리를 오래 비우는 것', buddy:'A' }
};
/* prd.md 「4. 문항」 — 보기마다 가까운 유형이 정해져 있다 */
var QUESTIONS = [
  { q:'캠핑 날짜가 잡히면 가장 먼저 하는 일은?', o:[['새 장비를 찾아본다','A'],['메뉴를 정한다','C'],['준비물 목록을 적는다','D'],['근처에 갈 만한 곳을 찾는다','F']] },
  { q:'캠핑장에 도착해서 가장 먼저 하는 일은?', o:[['장비를 꺼내 자리를 잡는다','A'],['의자부터 펴고 앉는다','E'],['불 피울 자리를 본다','B'],['주변을 한 바퀴 돈다','F']] },
  { q:'짐을 쌀 때 가장 오래 고르는 것은?', o:[['랜턴과 테이블 같은 장비','A'],['식재료와 양념','C'],['장작과 불쏘시개','B'],['베개와 담요','E']] },
  { q:'저녁 시간에 나는 주로 무엇을 하나?', o:[['불을 지킨다','B'],['요리를 한다','C'],['다음 날 일정을 확인한다','D'],['누워서 하늘을 본다','E']] },
  { q:'옆 자리 캠퍼에게 가장 먼저 눈이 가는 것은?', o:[['처음 보는 장비','A'],['굽고 있는 음식','C'],['불 피우는 솜씨','B'],['자리를 잡은 위치','D']] },
  { q:'아침에 일어나면 가장 먼저 하는 일은?', o:[['산책을 나간다','F'],['커피부터 내린다','C'],['철수 시간을 확인한다','D'],['다시 눕는다','E']] },
  { q:'비 예보가 뜨면 무엇을 하나?', o:[['타프와 방수 장비를 챙긴다','A'],['날짜를 바꾸거나 대안을 정해 둔다','D'],['빗소리 들으며 쉴 생각을 한다','E'],['비 오는 날 갈 실내 장소를 찾는다','F']] },
  { q:'캠핑에서 찍은 사진에 가장 많은 것은?', o:[['불','B'],['음식','C'],['풍경과 동네','F'],['세팅한 자리','A']] },
  { q:'캠핑이 끝나고 가장 먼저 하는 말은?', o:[['「다음엔 이걸 사야겠다」','A'],['「불멍 더 하고 싶다」','B'],['「거기 또 걷고 싶다」','F'],['「푹 쉬었다」','E']] },
  { q:'다음 캠핑을 정할 때 가장 먼저 보는 것은?', o:[['예약 가능한 날짜와 자리','D'],['장작을 쓸 수 있는지','B'],['근처 산책길과 시장','F'],['조용한지','E']] }
];
var ORDER = ['A','B','C','D','E','F'];   /* 점수가 같으면 앞에 있는 유형 */
var answers = [], current = 0, mine = null;
function $(id){ return document.getElementById(id); }
function showOnly(id){ ['start','quiz','result'].forEach(function(s){ $(s).hidden = (s !== id); if (s === id){ $(s).classList.remove('fade'); void $(s).offsetWidth; $(s).classList.add('fade'); } }); window.scrollTo(0, 0); }
function drawQuestion(){
  var q = QUESTIONS[current];
  $('count').textContent = (current + 1) + ' / ' + QUESTIONS.length;
  $('barFill').style.width = (current / QUESTIONS.length * 100) + '%';
  $('question').textContent = q.q;
  var box = $('opts'); box.innerHTML = '';
  q.o.forEach(function(opt){
    var b = document.createElement('button'); b.type = 'button'; b.className = 'opt'; b.textContent = opt[0];
    b.addEventListener('click', function(){ answers[current] = opt[1]; current += 1; if (current < QUESTIONS.length) drawQuestion(); else finish(); });
    box.appendChild(b);
  });
  $('qcard').classList.remove('fade'); void $('qcard').offsetWidth; $('qcard').classList.add('fade');
}
function scores(){ var s = {}; ORDER.forEach(function(k){ s[k] = 0; }); answers.forEach(function(k){ s[k] += 1; }); return s; }
function judge(s){ var best = ORDER[0]; ORDER.forEach(function(k){ if (s[k] > s[best]) best = k; }); return best; }
function finish(){ var s = scores(); mine = { key: judge(s), s: s }; showResult(mine.key); showOnly('result'); }
function showResult(key){
  var t = TYPES[key], own = mine && key === mine.key;
  $('lead').textContent = own ? '나의 캠핑 유형은' : '다른 유형 보기';
  $('typeIcon').textContent = t.icon; $('typeName').textContent = t.name; $('typeIntro').textContent = t.intro;
  $('typeGood').textContent = t.good; $('typeCare').textContent = t.care;
  $('typeBuddy').textContent = TYPES[t.buddy].icon + ' ' + TYPES[t.buddy].name + ' — ' + TYPES[t.buddy].intro.split('. ')[0] + '.';
  $('dist').innerHTML = mine ? ORDER.map(function(k){ return '<div class="row' + (k === mine.key ? ' on' : '') + '"><span>' + TYPES[k].name + '</span><span class="bar"><b style="width:' + (mine.s[k] / QUESTIONS.length * 100) + '%"></b></span><span>' + mine.s[k] + '</span></div>'; }).join('') : '';
  $('all').innerHTML = ORDER.map(function(k){ return '<button type="button" data-k="' + k + '" class="' + (k === key ? 'on' : '') + '"><i>' + TYPES[k].icon + '</i>' + TYPES[k].name + (mine && k === mine.key ? ' · 나' : '') + '</button>'; }).join('');
}
function copy(text){
  function done(){ $('shareMsg').textContent = '복사했습니다: ' + text; }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, done); else done();
}
$('faces').innerHTML = ORDER.map(function(k){ return '<div><i>' + TYPES[k].icon + '</i>' + TYPES[k].name + '</div>'; }).join('');
$('startBtn').addEventListener('click', function(){ answers = []; current = 0; mine = null; drawQuestion(); showOnly('quiz'); });
$('all').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b) showResult(b.getAttribute('data-k')); });
$('shareBtn').addEventListener('click', function(){ copy('나는 ' + TYPES[mine.key].name + '! ' + TITLE); });
$('againBtn').addEventListener('click', function(){ showOnly('start'); });
</script>
</body>
</html>
