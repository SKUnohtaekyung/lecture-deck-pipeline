<style>
:root{ --bg:#1E1E1E; --panel:#262626; --panel2:#2F2F2F; --ink:#DADADA; --sub:#8E8E8E; --line:#363636; --accent:#A882FF; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:"Pretendard","Malgun Gothic",sans-serif; font-size:14px; line-height:1.55; font-variant-numeric:tabular-nums; }
.app{ display:grid; grid-template-columns:44px 280px 1fr 380px; grid-template-rows:38px 1fr 26px; height:100vh; }
.titlebar{ grid-column:1/-1; display:flex; align-items:center; gap:14px; padding:0 14px; background:var(--panel); border-bottom:1px solid var(--line); font-size:13px; color:var(--sub); }
.titlebar b{ color:var(--ink); font-weight:700; }
.titlebar .tab{ padding:6px 14px; border-radius:8px 8px 0 0; background:var(--bg); color:var(--ink); align-self:flex-end; }
.titlebar .sp{ margin-left:auto; display:flex; gap:8px; }
button{ font:inherit; cursor:pointer; }
.tbtn{ border:0; border-radius:6px; padding:5px 12px; font-size:12px; font-weight:700; background:var(--panel2); color:var(--ink); }
.tbtn.p{ background:var(--accent); color:#16101F; }
.ribbon{ grid-row:2; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:14px; padding-top:14px; }
.ribbon svg{ width:20px; height:20px; stroke:var(--sub); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.ribbon svg.on{ stroke:var(--accent); }
.side{ grid-row:2; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
.side input{ margin:12px; padding:8px 12px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; outline:none; }
.side input:focus{ border-color:var(--accent); }
.seg{ display:flex; gap:4px; margin:0 12px 8px; }
.seg button{ flex:1; border:0; border-radius:6px; padding:5px; font-size:12px; font-weight:700; background:none; color:var(--sub); }
.seg button.on{ background:var(--panel2); color:var(--ink); }
.tree{ flex:1; overflow:auto; padding:0 6px 12px; }
.fold{ padding:5px 8px; font-size:13px; font-weight:700; color:var(--ink); cursor:pointer; user-select:none; }
.fold::before{ content:"▾ "; color:var(--sub); } .fold.shut::before{ content:"▸ "; }
.fold.shut + .kids{ display:none; }
.file{ display:flex; align-items:center; gap:8px; padding:4px 8px 4px 22px; border-radius:5px; font-size:13px; color:var(--sub); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.file:hover{ background:var(--panel2); color:var(--ink); } .file.on{ background:rgba(168,130,255,.18); color:var(--ink); }
.file i{ flex:none; width:8px; height:8px; border-radius:50%; background:var(--c); }
.file em{ margin-left:auto; font-style:normal; font-size:10px; font-weight:800; color:var(--sub); border:1px solid var(--line); border-radius:4px; padding:0 4px; }
.stage{ grid-row:2; position:relative; min-width:0; overflow:hidden; background:radial-gradient(ellipse at center,#252525 0%,#1A1A1A 100%); }
#graph{ position:absolute; inset:0; }
#labels{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
#labels span{ position:absolute; transform:translate(-50%,10px); font-size:11px; font-weight:600; color:var(--c,#B0B0B0); white-space:nowrap; text-shadow:0 0 4px #000,0 0 2px #000; transition:opacity .2s; }
/* 연결점(접점) — 어두운 알약 바탕에 흰 굵은 글자 + 연결 수. 많이 연결된 것은 더 크게 */
#labels span.ent{ transform:translate(-50%,13px); z-index:2; padding:1px 9px; border-radius:99px; background:rgba(18,18,18,.82); box-shadow:0 0 0 1px rgba(255,255,255,.4); color:#FFF; font-weight:700; font-size:12px; text-shadow:none; }
#labels span.ent.hub{ font-size:16px; padding:3px 12px; box-shadow:0 0 0 2px #FFF, 0 0 14px rgba(255,255,255,.35); }
#labels span.ent em{ font-style:normal; margin-left:6px; font-size:.8em; color:#C9B2FF; }
/* 주제 묶음 이름 — 묶음 한가운데 위에 색 알약으로 */
#labels span.grp{ transform:translate(-50%,-50%); z-index:3; padding:5px 16px; border-radius:99px; background:var(--c); color:#16101F; font-size:19px; font-weight:800; text-shadow:none; box-shadow:0 4px 14px rgba(0,0,0,.45); }
/* 이름표도 누를 수 있다 — 작은 공을 정확히 맞히지 않아도 된다 */
#labels span.ent, #labels span.grp, #labels span.doc{ pointer-events:auto; cursor:pointer; }
#labels span.doc{ padding:2px 8px; border-radius:99px; background:rgba(18,18,18,.72); text-shadow:none; font-size:12px; }
#labels span.ent:hover, #labels span.doc:hover{ box-shadow:0 0 0 2px #A882FF; }
#labels span.grp:hover{ box-shadow:0 0 0 3px #FFF, 0 4px 14px rgba(0,0,0,.45); }
#labels span.dim{ opacity:.08; pointer-events:none; }
.hud{ position:absolute; left:16px; top:14px; display:flex; gap:10px; }
.stat{ background:rgba(38,38,38,.88); border:1px solid var(--line); border-radius:10px; padding:8px 14px; }
.stat b{ display:block; font-size:22px; font-weight:800; color:#FFF; line-height:1.15; }
.stat span{ font-size:11px; color:var(--sub); }
.legend{ position:absolute; left:16px; bottom:14px; display:flex; flex-wrap:wrap; gap:6px; max-width:70%; }
.legend button{ display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:99px; padding:4px 11px; font-size:12px; font-weight:600; background:rgba(38,38,38,.88); color:var(--ink); }
.legend button i{ width:9px; height:9px; border-radius:50%; background:var(--c); }
.legend button.off{ opacity:.35; }
.help{ position:absolute; right:16px; bottom:14px; font-size:11px; color:var(--sub); text-align:right; }
.note{ grid-row:2; background:var(--bg); border-left:1px solid var(--line); overflow:auto; padding:22px 24px 40px; }
.note h1{ margin:0 0 6px; font-size:24px; font-weight:800; color:#FFF; letter-spacing:-.02em; line-height:1.3; }
.note .path{ font-size:12px; color:var(--sub); word-break:break-all; }
.note h2{ margin:22px 0 8px; font-size:13px; font-weight:800; color:var(--accent); letter-spacing:.03em; }
.note p{ margin:0 0 8px; } .note ul{ margin:0; padding-left:18px; } .note li{ margin-bottom:5px; }
.note pre{ margin:0; white-space:pre-wrap; font:inherit; font-size:13px; color:#B8B8B8; background:var(--panel); border-radius:8px; padding:12px 14px; max-height:260px; overflow:auto; }
.tag{ display:inline-block; margin:0 6px 6px 0; padding:2px 10px; border-radius:99px; font-size:12px; font-weight:600; background:rgba(168,130,255,.16); color:#C9B2FF; cursor:pointer; }
.link{ display:flex; align-items:center; gap:8px; padding:5px 8px; margin:0 -8px; border-radius:5px; cursor:pointer; color:var(--ink); }
.link:hover{ background:var(--panel); } .link i{ flex:none; width:8px; height:8px; border-radius:50%; background:var(--c); }
.callout{ border-left:3px solid #E5B567; background:rgba(229,181,103,.1); border-radius:0 8px 8px 0; padding:10px 14px; margin-top:10px; font-size:13px; }
.callout.ai{ border-color:var(--accent); background:rgba(168,130,255,.1); }
.rank{ display:grid; grid-template-columns:1fr auto; gap:4px 12px; }
.rank span:nth-child(even){ color:var(--sub); text-align:right; }
.status{ grid-column:1/-1; display:flex; align-items:center; justify-content:flex-end; gap:18px; padding:0 14px; background:var(--panel); border-top:1px solid var(--line); font-size:11px; color:var(--sub); }
::-webkit-scrollbar{ width:8px; height:8px; } ::-webkit-scrollbar-thumb{ background:#3A3A3A; border-radius:4px; }
@media (max-width:1100px){ .app{ grid-template-columns:44px 220px 1fr; } .note{ position:fixed; right:0; top:38px; bottom:26px; width:340px; box-shadow:-12px 0 32px rgba(0,0,0,.5); } }
</style>
</head>

    <div class="callout ai" style="margin-top:16px"><b>AI가 읽은 요점</b><ol style="margin:8px 0 0;padding-left:18px"><li>4월의 중심은 <b>「데일리 키친」 출시(4/13)</b>입니다. 기획서 · 가격안 · 견적서 · 계약서 초안 · 회의록 등 ${nb['E:데일리 키친'].length}개 문서가 이어져 있고, KC 인증 서류가 일정의 관건입니다.</li><li><b>3/25 라이브방송</b>이 매출 · 재고 · 문의 문서에 함께 나옵니다. 텀블러 품절과 출고 지연이 같은 날에서 시작됐습니다.</li><li><b>김나연</b>에게 제조사 · 발주 · 사양 · 불량 확인이 몰려 있습니다(연결 ${byId['E:김나연'].deg}개).</li></ol></div>
    <h2>내용이 어긋나는 곳</h2><ul><li>브랜드 소개서 두 파일의 숫자가 다릅니다: 누적 주문 6만 / 7만 건, 재구매율 31% / 34%</li><li>3월 매출: 「2026 월별 목표와 실적」은 1,360만 원인데 주별 자료로는 확인할 수 없습니다 — 확인 필요</li><li>초도 물량: 기획서는 「250과 300 가운데 정하는 중」, 견적서는 250세트 기준</li></ul>
    <h2>가장 많이 연결된 것</h2><div class="rank">${top.map(e => `<span class="link" data-id="${e.id}" style="margin:0">${e.title}</span><span>문서 ${e.deg}개</span>`).join('')}</div>
    <h2>쓰는 법</h2><p style="color:var(--sub)">왼쪽에서 문서를 고르거나 검색합니다. 그래프의 공을 누르면 그 문서의 요약과 연결된 문서가 여기에 열립니다. 색 범례를 누르면 그 묶음을 숨깁니다.</p>`;
}
let mode = 'group';
function renderTree(){
  const key = mode === 'group' ? 'group' : 'folder', groups = {};
  docs.filter(d => !query || match(d)).forEach(d => (groups[d[key]] = groups[d[key]] || []).push(d));
  tree.innerHTML = Object.keys(groups).sort().map(g => `<div class="fold">${g} <span style="color:var(--sub);font-weight:500">${groups[g].length}</span></div><div class="kids">${groups[g].map(d => `<div class="file ${d.id === active ? 'on' : ''}" data-id="${d.id}" title="${d.file}">${dot(d)}<span style="overflow:hidden;text-overflow:ellipsis">${d.title}</span><em>${d.ext}</em></div>`).join('')}</div>`).join('') || '<div class="file">검색 결과 없음</div>';
}
legend.innerHTML = Object.keys(C).map(g => `<button data-g="${g}"><i style="--c:${C[g]}"></i>${g}</button>`).join('') + `<button disabled style="opacity:.8"><i style="--c:#fff"></i>연결점(사람 · 거래처 · 상품 · 주제)</button>`;
legend.addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (!b) return; const g = b.dataset.g; hidden.has(g) ? hidden.delete(g) : hidden.add(g); b.classList.toggle('off'); G.nodeVisibility(visible).linkVisibility(l => visible(byId[l.source.id || l.source]) && visible(byId[l.target.id || l.target])); refresh(); });
document.addEventListener('click', e => { const f = e.target.closest('[data-id]'); if (f) openNote(f.dataset.id); const fo = e.target.closest('.fold'); if (fo) fo.classList.toggle('shut'); });
seg.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; mode = b.dataset.m; [...seg.children].forEach(x => x.classList.toggle('on', x === b)); renderTree(); });
q.addEventListener('input', () => { query = q.value.trim().toLowerCase(); active = null; renderTree(); refresh(); });
homeBtn.onclick = () => { active = null; focus = null; refresh(); home(); };
spinBtn.onclick = () => { spin = !spin; spinBtn.textContent = spin ? '회전 멈춤' : '회전 켜기'; if (spin){ const c = G.cameraPosition(); angle = Math.atan2(c.x, c.z); dist = Math.hypot(c.x, c.z); } };
xlsBtn.onclick = () => { const wb = XLSX.utils.book_new(); const ws = XLSX.utils.json_to_sheet(docs.map(d => ({ '제목':d.title, '원본 위치':'내문서/' + d.folder + '/' + d.file, '묶음':d.group, '한 줄 요약':d.sum, '연결된 이름':d.ents.join(', '), '비고':DUP[d.id] ? '중복 의심' : '' })));
  ws['!cols'] = [34,52,10,70,50,12].map(w => ({ wch:w })); XLSX.utils.book_append_sheet(wb, ws, '문서 색인'); XLSX.writeFile(wb, '하루상점_문서색인.xlsx'); };
renderTree(); renderHome();
</script>
