  say('점검 모드입니다. 빨간 테두리는 고칠 곳, 파란 점선은 글자 안전 여백입니다.');
  panel();
  SCAN = scenes.map(function (sc) { render(hold(sc)); return inspect(); });
  panel();
  var dt = 1 / 30, n = Math.floor(TOTAL / dt) + 1, kf = 0, vals = [];
  (function step() {
    var end = Math.min(n, kf + 45);
    for (; kf < end; kf++) { render(kf * dt); vals.push(meanLum()); }
    if (kf < n) { setTimeout(step, 0); return; }
    FLASH = { done: true, max: vals.length > 1 ? flashes(vals, dt) : 0 };
    if (qt != null) { render(qt); var r = inspect(); NOW = { t: qt, probs: r.probs, frozen: true }; marks(r.probs); panel(); }
    else { render(0); liveMarks(0, true); play(); }
  })();
}

/* ---------- 시작 ---------- */
var qs = new URLSearchParams(location.search), qv = qs.get('t');
var qt = (qv !== null && qv !== '' && isFinite(+qv)) ? Math.max(0, +qv) : null;
if (ERR.length) say(ERR[0]);
if (qs.get('check') === '1') startCheck(qt);
else if (qt != null) { render(qt); }
else if (root.classList.contains('no-anim')) { render(TOTAL); }
else play();
})();
</script>
