  <meta name="viewport" content="width=1280">
  <title>FRAME — AI 에이전트 실습 · 4시간</title>
  <!-- 파비콘은 테마 토큰을 쓸 수 없는 유일한 색 자리다 — FRAME 마크(페트롤 틀 + 아쿠아 사각형) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><path d='M8 18 V8 H18 M30 8 H40 V18 M40 30 V40 H30 M18 40 H8 V30' fill='none' stroke='%230E4A5A' stroke-width='5'/><rect x='19' y='19' width='10' height='10' fill='%237DE0EC'/></svg>">
  <!-- 폰트: Pretendard(제목·본문) + D2Coding(요청문·코드). 배포본은 사용 글자 서브셋을 임베드한다 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wan2land/d2coding/d2coding-full.css">
  <!-- ⚠️ 경로는 «생성물 강의덱.html의 위치» 기준 4단계다(courses/<과목>/sessions/N주차/). 틀려도 정적 검증은 PASS하고
       브라우저에서만 «전 슬라이드 동시 표시 + 로고 0×0»으로 드러난다 — 조립 후 document.styleSheets.length를 확인한다. -->
  <link rel="stylesheet" href="../../../../kit/styles/deck.css">
  <link rel="stylesheet" href="../../../../kit/styles/legibility.css">
  <link rel="stylesheet" href="../../../../kit/styles/patterns.css">
  <link rel="stylesheet" href="../../../../kit/themes/frame/tokens.css">
  <style id="kit-additions">
    /* 이 덱 전용 CSS는 여기 둔다. 새 구도 클래스는 deck.contract.json의 layout_families에 등재한다
       (미등재 구도는 full로 뭉개져 「동일 구도 연속」 FAIL 오탐이 난다). */

    /* ══════════════════════════════════════════════════════════════════
       기본 경화 5종 — 지우지 말 것 (2026-08-03 신설)
       ══════════════════════════════════════════════════════════════════
       왜 여기 있나: 지금까지 주차별 교정이 그 주차 shell에만 쌓이고 템플릿으로
       돌아오는 경로가 없었다. 그래서 새 주차를 시작할 때마다 아래 5종이 전부
       원상복귀했고, 사용자가 같은 지적을 반복했다(실측: 2주차가 얻어낸 교정 5종
       중 템플릿에 반영된 것 0건).

       값의 정본은 kit/guide/토큰-치트시트.md(R-TYPE-01·03)이고 여기는 집행부다.
       규칙이 바뀌면 정본을 먼저 고치고 여기를 맞춘다 — 반대로 하지 않는다.
       ⚠️ 이 블록의 셀렉터는 전부 kit에 실재하는 클래스만 겨냥한다. 없는 클래스를
          적어 두면 「규칙이 있는 것처럼 보이는데 아무 일도 안 하는」 상태가 된다.
       ────────────────────────────────────────────────────────────────── */

    /* ① 본문 22px 하한 회복 (R-TYPE-01) ───────────────────────────────
       kit의 .work-step은 b·span에만 크기를 걸어 두어, 클래스 없는 맨 텍스트와
       <p>가 컨테이너 기본값 16px를 그대로 물려받는다. 컨테이너에 직접 건다.
       (선례: 46장 242건 4,537자가 이 경로로 하한 미만이 됐다) */
    .slide .work-step{ font-size:var(--fs-body); line-height:1.45; }
    .slide .work-step p{ margin:0; font-size:var(--fs-body); line-height:1.45; }
    /* ⚠️ line-height 1.45는 리터럴로 둔다. 값이 같은 토큰(`--lh-lead`)이 있지만
          그건 「리드」 역할이라, 여기 쓰면 **값은 맞고 의미는 틀린** 배선이 된다.
          토큰은 값이 같다고 쓰는 것이 아니라 역할이 같을 때 쓴다. */

    /* ② 역할 위계 — 박스 제목 26/800 · 박스 설명 20/500 ────────────────
       2026-07-31 사용자 결정: "제목과 설명 폰트 사이즈가 똑같다. 설명이 더
       작아야지" · "전체적으로 다 볼드에 글씨 크기 똑같다. 폰트 시스템 쓰자" ·
       "bold를 미디움 정도로 낮춰 써도 된다 — 본문이나 설명 글씨는".
       R-TYPE-01의 「박스 제목」·「박스 안 설명문」 행이 이 규칙의 정본이다.

       ⚠️ 명시도를 .deck .slide[data-slide]로 올려 둔 이유: 파트별로 작업하면
          `.slide[data-slide="X"] .work-step b`(0,3,1) 같은 국소 규칙이 전역
          규칙(0,2,1)을 이겨 한 덱 안에서 21·22·23·24·26px가 섞인다.
          !important는 쓰지 않는다 — 정당한 개별 예외의 여지를 남긴다.

       ⚠️ 이 주차가 새 박스 구도를 만들면 그 제목·설명 셀렉터를 아래 목록에
          **추가**하라. 추가하지 않으면 그 구도만 위계 밖에 남는다.

       ⚠️ 설명문 20px은 「박스 내부 보조 서술」 한정이다. 본문 문장
          (.s-body·.s-lead)의 22px 하한은 그대로다. 그리고 20px 줄은 짧아야
          한다 — 긴 문장을 20px로 내리면 가독성이 떨어진다(권장 25자 이내,
          넘으면 문장을 나누거나 22px 본문으로 올린다).

       ⚠️ `.cd-leaf > b`·`.cd-out`는 일부러 뺐다. kit의 실제 마크업이
          `<b class="cd-out">`(= .cd-leaf의 직계 자식이자 같은 노드)이라 두
          규칙이 **같은 노드**를 겨냥하고, 타입 셀렉터 한 칸 차이로 제목 규칙이
          이겨 설명 규칙이 죽는다. 게다가 kit의 `.cd-out`(19px/800 블루)은
          「박스 안 설명문」이 아니라 **결론 라벨**이다. R-TYPE-01이 `.cd-out`을
          설명문 행에 적어 둔 것은 정정 대상이다(FINDINGS.md 참고). */
    .deck .slide[data-slide] .work-step > b,
    .deck .slide[data-slide] .card > h3,
    .deck .slide[data-slide] .cc-side > h3{
      font-size:var(--fs-box-title); font-weight:800; line-height:var(--lh-box-title); }
    .deck .slide[data-slide] .desc{
      font-size:var(--fs-box-desc); font-weight:500; line-height:var(--lh-box-desc); }

    /* ⑥ 스텝 본문 래퍼(.ws-body) — R-QC-19(격자 안 맨 텍스트) 대응으로 클래스를 붙였으므로
       위계 셀렉터도 여기에 등재한다. 등재하지 않으면 이 구도만 위계 밖에 남는다. */
    .slide .work-step .ws-body{ display:flex; flex-direction:column; gap:3px; min-width:0; }
    .deck .slide[data-slide] .work-step .ws-body > b{
      font-size:24px; font-weight:800; line-height:var(--lh-box-title); }
    .deck .slide[data-slide] .work-step .ws-body > span{
      font-size:var(--fs-body); font-weight:500; line-height:1.5; color:var(--gray-700); }


    /* ③ 카드·박스 간 여백 — kit 기본 14px는 촘촘하다 ────────────────────
       사용자 지시: "각 카드별 여백이 너무 적어" · "박스가 지금 너무 촘촘해". */
    .slide .grid-2, .slide .grid-3{ gap:var(--sp-18); }

    /* ④ 빈 이미지 슬롯을 학생 화면에 표시하지 않는다 ────────────────────
       사용자 지시: "이미지를 넣을 공간에 박스로 영역을 표시해 놓는데 이거를
       다 지워야 해." kit/styles/deck.css는 빈 슬롯에 점선 테두리 + 연파랑
       배경 + "이미지 예정" 라벨을 그린다 — 그 표시만 끈다.
       ⚠️ 슬롯 자체를 없애는 게 아니다. 좌표·크기·본문 인셋은 그대로 두고
          (이미지 작업과 충돌 방지), verify_deck_quality의 R-QC-18(빈 슬롯
          검출)도 계속 유효하다. 화면 노출만 막는 것이다. */
    .deck .slide .asset-slot,
    .deck .slide .asset-slot[data-image-state="expected"]{
      border:0; background:none; box-shadow:none; }
    .deck .slide .asset-slot[data-image-state="expected"]::before{ content:none; }

    /* ⑤ 교시 로드맵(.roadmap) — 교시마다 같은 모양을 쓴다 ────────────────
       사용자가 세 번 요청한 「교시 로드맵 템플릿 통일」이다. 통일되지 않으면
       교시마다 스텝 수·아이콘·산출물 줄이 제각각이 된다(실측: 5장이 스텝
       6·4·4·5·5 · 아이콘 클래스 2종 혼재 · 산출물 줄은 1장에만).

       마크업 골격은 part-01.html의 data-slide="M1" 슬라이드에 있다 — 그것을
       복사해 교시 수만큼 만든다.
       금지: 장식 아이콘 SVG · 스텝 6개 이상 · .rm-* 클래스 재정의.
       ⚠️ 로드맵은 「박스만 있고 시각자료가 없는 장」이 되기 쉽다(실측: 로드맵
          5장이 장당 박스 12.6개로 기준판의 2.3배인데 시각자료 보유 0). 스텝을
          늘리는 대신 이해를 돕는 시각자료를 함께 두는 쪽을 먼저 검토하라.
       ⚠️ .roadmap을 이 주차 deck.contract.json의 layout_families에 등재할 것. */
    .roadmap .s-full{ bottom:54px; display:flex; flex-direction:column; }
    .roadmap .rm-lead{ margin:8px 0 0; font-size:var(--fs-body); font-weight:700;
      color:var(--blue); line-height:1.4; }
    .roadmap .rm-track{ flex:1 1 auto; min-height:0; display:flex;
      align-items:stretch; gap:10px; margin:20px 0 0; }
    .roadmap .rm-step{ flex:1 1 0; min-width:0; display:flex; flex-direction:column;
      align-items:flex-start; justify-content:flex-start; gap:10px;
      padding:22px 18px 18px; text-align:left;
      border-radius:var(--r-lg); background:var(--blue-soft);
      border:1px solid var(--blue-line); box-shadow:var(--shadow-md); }
    .roadmap .rm-step .rm-n{ flex:0 0 auto; width:44px; height:44px; border-radius:50%;
      background:var(--blue); color:var(--white); display:grid; place-items:center;
      font-size:20px; font-weight:800; }
    .roadmap .rm-step > b{ font-size:var(--fs-box-title); font-weight:800; color:var(--ink);
      line-height:1.22; }
    /* 크기·굵기·행간은 ②의 .desc 티어가 준다 — 여기서 다시 적지 않는다.
       (다시 적으면 명시도가 낮아 조용히 무시되고, 「있는데 안 듣는 규칙」이 된다) */
    .roadmap .rm-step .desc{ color:var(--gray-700); }
    .roadmap .rm-step .rm-out{ display:block; width:100%; margin-top:auto;
      padding-top:12px; border-top:1px solid var(--blue-line);
      font-size:20px; font-weight:800; color:var(--blue); line-height:1.35; }
    /* 마지막 스텝을 「이 교시의 도착점」으로 쓸 때만 .is-goal */
    .roadmap .rm-step.is-goal{ background:var(--mint-soft); border-color:var(--mint-line); }
    .roadmap .rm-step.is-goal > b{ color:var(--on-mint); }
    .roadmap .rm-step.is-goal .rm-n{ background:var(--mint); color:var(--on-mint); }
    .roadmap .rm-step.is-goal .rm-out{ color:var(--mint-deep); border-top-color:var(--mint-line); }
    .roadmap .rm-arrow{ flex:0 0 auto; align-self:center; font-size:24px;
      font-weight:800; color:var(--blue); }
    /* 5스텝은 칸이 좁다 — 제목만 한 단계 내린다(설명·산출물은 유지). */
    .roadmap .rm-track.is-5 .rm-step > b{ font-size:24px; }
    .roadmap .rm-track.is-5 .rm-step{ padding:20px 14px 16px; }

    /* 로드맵 시각자료 자리 — 있으면 트랙을 그만큼 좁힌다.
       ⚠️ .asset-slot은 position:absolute라 그냥 두면 트랙 **위에 겹친다**.
          `:has()`로 «슬롯이 있을 때만» 인셋을 준다 — 슬롯을 지우면 자동으로
          전폭으로 돌아간다(작성자가 클래스를 따로 붙일 필요가 없다).
       ⚠️ 슬롯을 안 쓸 거면 figure를 **삭제**한다. 남겨 두면 R-QC-18이 빈 슬롯으로
          잡는다(그게 의도다 — 「채우기로 해 놓고 안 채운 자리」를 잡는 검사다). */
    .roadmap .rm-visual{ top:150px; bottom:96px; height:auto; max-height:none; }
    .roadmap .s-full:has(.rm-visual) .rm-track{ margin-right:412px; }
    .roadmap .s-full:has(.rm-visual) .rm-lead{ max-width:760px; }


    /* ══════════════════════════════════════════════════════════════════
       FRAME 세션 CSS v2 — 옅은 면 · 흰 카드 · 큰 제목 · 색 글자 키워드 · 바닥 한 줄 머리
       정본: 사용자 승인 프리뷰 tmp/frame/view/design_dir.html · 작성 지침 tmp/frame/E/공통지침.md 「디자인 v2」
       색은 토큰(var(--*))과 이 파일의 커스텀 속성(--t-* · --pr-* · --sh-*)만 쓴다.
       raw hex · rgba()는 커스텀 속성 정의 줄에만 있다(verify_deck은 커스텀 속성 정의 줄을 색 검사에서 뺀다).
       ══════════════════════════════════════════════════════════════════ */

    /* ── 0. 색 · 그림자 정의 — 모든 장 공통(틴트 면 · 흰 카드 · 어두운 전면) ── */
    .slide{ --t-card:#FFFFFF; --t-mint:var(--mint-soft); --t-sky:#E2EFFA; --t-apricot:#FFEDE5; --t-mist:#EDF2F4; --t-lav:var(--t-sky); --t-sand:var(--t-mist);   /* lav·sand는 폐기 별칭(보라·노랑 제거) — 새로 쓰지 않는다 */
      --t-dark:#08323D; --t-dark-2:#1F5563; --t-dark-3:#2E7B8C; --t-dark-ink:#CFE7EC; --t-dark-soft:#9FC3CC; --t-memo:#F4E4DC;
      --t-pr-fill:#FF8A5C; --t-shadow:rgba(8,50,61,.16);
      --sh-card:0 6px 18px rgba(8,50,61,.10); --sh-pop:0 12px 32px rgba(8,50,61,.14); --sh-ic:0 4px 12px rgba(8,50,61,.10); --t-glow:rgba(125,224,236,.30); }

    /* ── 1. 기본 · 글자 ─────────────────────────────────────────────── */
    .slide{ line-height:1.45; font-weight:500; padding:56px 72px 0; isolation:isolate; word-break:keep-all; overflow-wrap:break-word; }   /* 행간 normal 방치를 막는다 · 자유 흐름 마크업(.kick · .s-title · .lede)의 여백 · 면(.bleed)이 글 아래로 가게 쌓임 맥락을 만든다 */
    .s-brand{ color:var(--gray-400); letter-spacing:.06em; }
    .slide p, .slide h1, .slide h2, .slide h3, .slide li, .slide figcaption, .slide button,
    .slide dt, .slide dd, .slide td, .slide th, .slide summary{ word-break:keep-all; overflow-wrap:break-word; }   /* 한국어는 어절 단위로 줄을 바꾼다 */
    .slide h1, .slide h2, .slide h3{ text-wrap:balance; }                                                          /* 제목은 줄 길이를 고르게 */
    .slide p, .slide li, .slide dd, .slide figcaption{ text-wrap:pretty; }                                        /* 본문은 외톨이 글자를 막는다 */
    .sr-only{ position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
    /* verify_deck는 s02-slide·s03-slide 클래스를 가진 장이 있어야 PASS한다(FIXED 상수 — 계약으로 끌 수 없다).
       이 덱에는 고정 도입·아젠다가 없으므로, 그 표지 역할만 두 장에 클래스로 달 수 있게 kit의 배치 규칙을 되돌린다.
       선택자는 kit와 같은 명시도(0,2,0)로 맞춰 이 파일의 제목 · eyebrow 규칙보다 앞에 둔다 — 뒤의 규칙이 이긴다.
       달아도 화면이 바뀌지 않는다(전후 픽셀 비교: tmp/frame/E1/marker_check.py). */
    .s02-slide .s-eyebrow{ font-size:var(--fs-eyebrow); margin:0 0 6px; }
    .s02-slide .s-title{ white-space:normal; }
    .s02-slide .s-lead{ font-size:var(--fs-lead); margin:0 0 14px; }
    .s03-slide .s-head .s-team{ display:block; }

    /* 눈썹(.kick) — 제목 위 색 글자 한 줄. 칩이 아니다. 기존 .s-eyebrow도 같은 모양 */
    .kick, .slide .s-eyebrow{ display:block; width:auto; margin:0; padding:0; border-radius:0; background:none;
      font-size:18px; font-weight:800; line-height:1.4; letter-spacing:.01em; color:var(--mint-deep); }
    /* 제목 — 48/700, 두 줄까지. 18자가 넘으면 글 쪽에서 의미 경계에 <br> */
    .slide .s-title{ margin:8px 0 0; font-size:48px; font-weight:700; line-height:1.25; letter-spacing:-.035em; color:var(--ink); }
    .slide .s-title .hl{ color:var(--mint-deep); }
    /* 보조 설명(.lede) — 제목 아래 회색 23px */
    .lede{ margin:14px 0 0; max-width:30em; font-size:23px; font-weight:500; line-height:1.6; color:var(--gray-400); }

    .slide [tabindex]:focus{ outline:none; }
    .slide [tabindex]:focus-visible, .slide button:focus-visible, .slide summary:focus-visible{ outline:2px dashed var(--ink); outline-offset:3px; }
    .slide svg [tabindex]:focus-visible{ outline:none; }        /* SVG 요소는 아래 .hit 테두리로 표시한다 */
    .slide .hit{ fill:transparent; stroke:none; }
    .slide svg [tabindex]:focus-visible .hit{ stroke:var(--ink); stroke-width:3; stroke-dasharray:6 4; }

    /* ── 2. 머리 → 바닥 한 줄 — s-head 마크업은 그대로 두고 위치 · 모양만 바꾼다(작은 로고 · 「FRAME · .s-team」 · 가로선 없음) ── */
    .s-head{ top:auto; bottom:22px; left:72px; right:auto; height:auto; gap:8px; font-size:14px; font-weight:600; color:var(--gray-400); }
    .s-logo{ width:18px; height:18px; }
    .s-brand{ font-size:14px; font-weight:700; }
    .s-line{ display:none; }
    .s-team{ margin:0; font-size:14px; line-height:1.4; font-weight:600; color:var(--gray-400); text-align:left; }
    .s-team::before{ content:"·"; margin:0 8px 0 0; }
    .slide.dark .s-head, .slide.dark .s-brand, .slide.dark .s-team, .slide.dark .s-pageno{ color:var(--t-dark-soft); }
    .slide.dark .s-logo path{ stroke:var(--t-dark-soft) !important; }

    /* ── 3. 실습 확장 색(§16-3) — 테마 토큰 100개는 고정이라 .slide.pr 범위 커스텀 속성으로 둔다 ──
       실습 표식(색 하나에 기대지 않는다): 주홍 눈썹 「실습 N」 · 타이머 · 단계 번호 · 살구 면. 왼쪽 주홍 띠는 없앴다. */
    .slide.pr{ --pr-deep:#B8431F; --pr-fill:#FF8A5C; --pr-soft:#FFEDE5; --pr-line:#F7C9B5; --pr-bg:#FFFFFF; }
    .slide.pr{ background:var(--pr-bg); }
    .slide.pr .kick, .slide.pr .s-eyebrow{ color:var(--pr-deep); }
    .slide.pr .s-title .hl{ color:var(--pr-deep); }
    code, .path{ font-family:inherit; font-weight:700; }          /* 고정폭 글꼴은 터미널 창 안에만 */
    .slide.pr code{ color:var(--pr-deep); }
    .path{ word-break:break-all; }

    /* ── 4. 강조 — 면(형광펜)을 없애고 색 글자 800으로 모은다. .mk · .mk-solid는 .kw와 같은 모양 ── */
    .kw, .mk, .mk-solid{ color:var(--mint-deep); font-weight:800; }
    .mk::after, .mk-solid::after{ content:none; }
    .slide.pr .kw, .slide.pr .mk, .slide.pr .mk-solid{ color:var(--pr-deep); }
    .slide.dark .kw, .slide.dark .mk, .slide.dark .mk-solid{ color:var(--mint); }
    .em-ink{ color:var(--blue); font-weight:800; }
    .slide.pr .em-ink{ color:var(--pr-deep); }
    .slide.dark .em-ink{ color:var(--white); }
    .em-line{ white-space:nowrap; text-decoration:underline; text-decoration-thickness:4px; text-underline-offset:7px; text-decoration-skip-ink:none; text-decoration-color:var(--mint); }
    .slide.pr .em-line{ text-decoration-color:var(--pr-fill); }
    .em-num{ font-size:1.6em; font-weight:800; line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums; color:var(--blue); }
    .slide.pr .em-num{ color:var(--pr-deep); }
    .s-title .em-num, .pr-top .em-num{ font-size:1.12em; }
    .em-tag{ position:relative; z-index:0; font-weight:700; color:var(--ink); padding:0 .3em; white-space:nowrap; }   /* 파일 · 버튼 · 메뉴 이름 — 본문 글꼴 + 옅은 칩 */
    .em-tag::after{ content:""; position:absolute; z-index:-1; left:0; right:0; top:.04em; bottom:.04em; border-radius:.45em; background:var(--blue-soft); }
    .slide.pr .em-tag::after{ background:var(--pr-soft); }
    /* 동그라미 — 시각 자료 안에서만. SVG 요소에 .em-ring을 직접 달거나, 글자 둘레는 .ring-host로 감싼다(엔진이 타원을 그린다) */
    .em-ring{ fill:none; stroke:var(--blue); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    .slide.pr .em-ring{ stroke:var(--pr-deep); }
    .ring-host{ position:relative; display:inline-block; }
    .ring-host > .ring-svg{ position:absolute; pointer-events:none; overflow:visible; }
    .terminal-dark .em-ring{ stroke:var(--mint); }                      /* 어두운 터미널 위에서는 아쿠아 */

    /* ── 5. 등장 연출 — 요소별 떠오름 · 형광펜 칠하기 · 팝 · 선 그리기는 없앴다(2026-10-01 사용자 지시 「넘길 때 애니메이션이 많다」).
       남기는 것은 도표 막대가 한 번 자라는 것(0.35초 · 차례 지연 없음)뿐이다. .rv · --i · --mkd 표기는 남아 있어도 효과가 없다.
       from 키프레임만 쓰고 fill-mode는 backwards다 — 끝나면 원래 상태로 남아 PDF·배포본·감사에서도 같은 모습이다. */
    @keyframes fr-rise{ from{ opacity:0; transform:translateY(12px); } }
    @keyframes fr-mark{ from{ transform:scaleX(0); } }
    @keyframes fr-grow{ from{ transform:scaleY(0); } }
    @keyframes fr-fade{ from{ opacity:0; } }
    @keyframes fr-draw{ from{ stroke-dashoffset:var(--len,100); } }
    @keyframes fr-fillx{ from{ transform:scaleX(0); } }
    @keyframes fr-pop{ from{ opacity:0; transform:scale(.6); } }
    .a-draw, .em-ring{ stroke-dasharray:var(--len,100); }
    .slide.is-active .a-grow{ transform-box:fill-box; transform-origin:center bottom; animation:fr-grow .35s cubic-bezier(.2,.8,.2,1) backwards; }
    .slide.is-active .a-fillx{ transform-box:fill-box; transform-origin:left center; animation:fr-fillx .35s cubic-bezier(.2,.8,.2,1) backwards; }
    /* 감사 모드 · 동작 줄이기 · 인쇄 → 즉시 최종 상태. 무한 반복 연출은 이 덱에 없다 */
    html.no-anim .slide *, html.no-anim .slide *::before, html.no-anim .slide *::after{ animation:none !important; transition:none !important; }
    @media (prefers-reduced-motion:reduce){
      .slide *, .slide *::before, .slide *::after{ animation:none !important; transition:none !important; }
      ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*){ animation:none !important; }
    }
    @media print{ .slide *, .slide *::before, .slide *::after{ animation:none !important; transition:none !important; } }
    /* 허브 전환(View Transition 0.45s) — 이름은 엔진이 출발·도착 요소에 잠깐 붙인다 */
    ::view-transition-group(frame-hero){ animation-duration:.45s; animation-timing-function:cubic-bezier(.2,.8,.2,1); }
    ::view-transition-old(root), ::view-transition-new(root){ animation-duration:.3s; }

    /* ── 6. 덩어리 — 세로 규칙선을 없앴다. 작은 색 라벨 + 글자 크기 위계(정의 26 · 비유 22 · 대응 22) ── */
    .rule{ position:relative; padding:0; }
    .rule::before{ content:none; }
    .rule .lab, .lab{ display:block; margin:0 0 4px; font-size:16px; font-weight:800; line-height:1.4; letter-spacing:.04em; color:var(--mint-deep); }
    .rule.ana .lab{ color:var(--gray-400); }
    .rule.do .lab{ color:var(--blue); }
    .slide.pr .rule .lab, .slide.pr .lab{ color:var(--pr-deep); }
    .rule p{ margin:0; font-size:var(--fs-body); line-height:1.6; font-weight:500; color:var(--gray-700); }
    .rule.def p{ font-size:26px; line-height:1.55; color:var(--ink); }
    .rule.do p{ color:var(--ink); font-weight:600; }
    .keep{ margin:0; font-size:var(--fs-body); line-height:1.45; color:var(--gray-700); }
    .keep b{ font-weight:800; color:var(--ink); }

    /* 측정 모드 — 엔진이 화면 밖 장의 대조선·동그라미를 그릴 때만 잠깐 붙는다(같은 동작 안에서 떼므로 화면에 나타나지 않는다) */
    html.fr-measure .slide{ display:block !important; position:relative !important; top:auto !important; left:auto !important; transform:none !important; }

    /* ── 5. 터미널 창(D32 요청문) — kit .terminal-dark 계약 위에 자리·글자만 얹는다. 복사 버튼은 `>` 없이 요청문만 복사한다 ── */
    .term{ width:100%; }
    .term.terminal-dark{ border-radius:20px; box-shadow:var(--sh-pop); }
    .term .terminal-bar b{ font-family:"Pretendard",sans-serif; font-size:17px; font-weight:700; }
    .term .copy{ margin-left:auto; font-family:"Pretendard",sans-serif; font-size:var(--fs-eyebrow); font-weight:800; line-height:1; color:var(--white);
      background:none; border:0; padding:6px 2px; cursor:pointer; text-decoration:underline; text-underline-offset:4px; }
    .term .terminal-copy{ padding:16px 24px 20px; }
    .term .terminal-copy p{ margin:0; font-size:var(--fs-box-desc); line-height:1.6; overflow-wrap:anywhere; }
    .term.lg .terminal-copy p{ font-size:var(--fs-body); line-height:1.65; }
    /* 긴 요청문 변형(E4-W1 제안 · 메인 반영) — dense: 글자 17px(터미널은 폰트 하한 제외) · fill: 남은 높이를 채우고 안에서 스크롤, 복사는 전문 */
    .term.dense .terminal-copy{ padding:12px 20px 14px; }
    .term.dense .terminal-copy p{ font-size:17px; line-height:1.5; }
    .term.xdense .terminal-copy p{ font-size:15px; line-height:1.4; }   /* 한 화면 긴 요청문 전용(M2-2) — 터미널은 글자 하한 밖, 참가자는 복사해 쓴다 */
    .term.fill{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
    .term.fill .terminal-copy{ flex:1 1 auto; min-height:0; overflow-y:auto; }
    .term .terminal-copy p + p{ margin-top:10px; }
    .term .terminal-copy.sep{ border-bottom:1.5px solid var(--gray-700); }   /* 한 창 안의 구간 구분 — 위쪽 테두리는 박스로 세어지므로 아래쪽 선만 쓴다 */
    .term .tc-tag{ display:inline-block; min-width:1.6em; margin-right:8px; font-family:"Pretendard",sans-serif; font-size:17px; font-weight:800; color:var(--mint); }
    .term .terminal-copy .ph{ color:var(--mint-soft); font-weight:700; }   /* 〈 〉 자리표시 */
    .term .copy:focus-visible{ outline:2px dashed var(--white); outline-offset:2px; }
    /* 펼침 칸 안의 터미널 — .reveal-body p의 글자색 · 여백이 터미널 글자를 덮지 않게(W1 제안 반영) */
    .reveal .reveal-body .term .terminal-copy p{ color:inherit; margin:0; }
    .reveal .reveal-body .term .terminal-copy p + p{ margin-top:10px; }

    /* ── 6. 창 모형(D27 공통 화면 모형 · 파일 창) — 흰 카드 + 약한 그림자. 테두리 선을 쓰지 않는다. 창 하나가 박스 1개 ── */
    .win{ background:var(--t-card); border-radius:20px; box-shadow:var(--sh-card); overflow:hidden; text-align:left; }
    .win-bar{ display:flex; align-items:center; gap:9px; min-height:46px; padding:0 20px; }
    .win-bar i{ flex:0 0 auto; width:10px; height:10px; border-radius:50%; background:var(--gray-400); opacity:.45; }
    .win-bar b{ margin-left:8px; font-size:17px; font-weight:700; color:var(--gray-700); line-height:1.3; }
    .win-body{ padding:4px 22px 20px; }
    .win-url{ position:relative; z-index:0; flex:1 1 auto; margin-left:10px; padding:5px 16px; font-size:17px; font-weight:700; color:var(--gray-700); }
    .win-url::before{ content:""; position:absolute; inset:0; z-index:-1; border-radius:999px; background:var(--blue-soft); }
    .win-side{ position:relative; z-index:0; float:left; width:200px; padding:14px 18px; min-height:100%; }
    .win-side::before{ content:""; position:absolute; inset:0; z-index:-1; background:var(--blue-panel); }
    .win-side p{ margin:0 0 8px; font-size:17px; font-weight:700; color:var(--gray-700); }
    .win.app .win-body{ padding:0; display:grid; grid-template-columns:200px 1fr; }
    .win.app .win-side{ float:none; }
    .win-main{ padding:14px 22px 18px; }
    .drop{ margin:10px 0; padding:22px 16px; text-align:center; font-size:var(--fs-body); font-weight:700; color:var(--gray-700); outline:3px dashed var(--mint); outline-offset:-3px; border-radius:var(--r-md); }
    .slide.pr .drop{ outline-color:var(--pr-fill); color:var(--ink); }
    /* 코드·파일 줄 — 줄 번호 + 본문. 파일 이름 · 경로 · 트리도 본문 글꼴이다(고정폭은 터미널 안에만). .hit 줄은 왼쪽 띠로 표시한다 */
    .code{ margin:0; font-family:inherit; font-size:var(--fs-box-desc); font-weight:600; line-height:1.6; color:var(--gray-700); white-space:pre-wrap; word-break:keep-all; overflow-wrap:anywhere; font-variant-numeric:tabular-nums; }
    .code .l{ display:block; position:relative; min-height:1.6em; padding-left:54px; }
    .code .l > i{ position:absolute; left:0; width:38px; text-align:right; font-style:normal; color:var(--gray-400); }
    .code .l.ref{ color:var(--gray-700); font-weight:600; }
    .code .l.hit, .code .l.on{ color:var(--ink); font-weight:800; }
    .code .l.hit::before, .code .l.on::before{ content:""; position:absolute; left:-12px; top:3px; bottom:3px; width:6px; border-radius:3px; background:var(--mint); }
    .slide.pr .code .l.hit::before, .slide.pr .code .l.on::before{ background:var(--pr-fill); }
    .slide.pr .code .l.on{ color:var(--pr-deep); }
    .code .l.gap{ color:var(--gray-400); }
    .code .dir{ font-weight:800; color:var(--ink); }
    .bubble{ display:block; width:fit-content; max-width:100%; margin:8px 0; padding:10px 18px; border-radius:var(--r-lg); background:var(--blue-soft); font-size:var(--fs-box-desc); line-height:1.45; color:var(--ink); }
    .bubble.me{ margin-left:auto; background:var(--mint-soft); }
    .slide.pr .bubble, .slide.pr .bubble.me{ background:var(--pr-soft); }
    /* 박스 없는 대화 — 작은 라벨 + 글 */
    .say{ position:relative; margin:0 0 18px; padding:0; }
    .say .who{ display:block; margin:0 0 2px; font-size:16px; font-weight:800; line-height:1.4; letter-spacing:.04em; color:var(--gray-400); }
    .say.me .who{ color:var(--mint-deep); }
    .slide.pr .say.me .who{ color:var(--pr-deep); }
    .say p{ margin:0; font-size:var(--fs-body); font-weight:600; line-height:1.55; color:var(--ink); }

    /* ── 7. 표 — 선 없이 머리 글자 색 + 줄 사이 여백. 고른 행은 옅은 면(inset 그림자)으로 표시한다 ── */
    .ftbl{ width:100%; border-collapse:separate; border-spacing:0; }
    .ftbl th, .ftbl td{ text-align:left; padding:10px 12px; font-size:var(--fs-box-desc); font-weight:500; line-height:1.3; color:var(--ink); vertical-align:middle; }
    .ftbl th{ font-size:var(--fs-table); font-weight:800; color:var(--mint-deep); white-space:nowrap; }
    .slide.pr .ftbl th{ color:var(--pr-deep); }
    .ftbl td.src{ font-size:18px; font-weight:600; color:var(--gray-700); white-space:nowrap; }
    .ftbl .x{ color:var(--red); font-weight:800; }
    .ftbl tr[data-pick]{ cursor:pointer; }
    .ftbl tr[data-pick]:focus-visible{ outline:2px dashed var(--ink); outline-offset:-2px; }
    .ftbl tr[data-pick] td{ color:var(--gray-700); }
    .ftbl tr[data-pick].on td{ color:var(--ink); font-weight:700; box-shadow:inset 0 0 0 100px var(--blue-soft); }
    .slide.pr .ftbl tr[data-pick].on td{ box-shadow:inset 0 0 0 100px var(--pr-soft); }
    .ftbl tr[data-pick].on td:first-child{ border-radius:12px 0 0 12px; }
    .ftbl tr[data-pick].on td:last-child{ border-radius:0 12px 12px 0; }
    .slide.pr .ftbl tr[data-pick].on td.due{ color:var(--pr-deep); font-weight:800; }
    .ftbl-cap{ display:block; margin:0 0 4px; font-size:var(--fs-caption); font-weight:700; color:var(--gray-700); }

    /* ── 8. 조작 요소 ── */
    /* 단계 목록(큰 번호 세로 흐름 · 박스 없음) — data-w="todo": 눌러서 완료 표시 */
    .flow{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:12px; }
    .flow button{ display:grid; grid-template-columns:58px 1fr; gap:14px; align-items:start; width:100%; text-align:left; font:inherit; color:var(--ink); background:none; border:0; padding:4px 0; cursor:pointer; }
    .flow .n{ font-size:44px; font-weight:800; line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums; color:var(--pr-deep); text-align:center; }   /* 표식 ④ 단계 번호 */
    .flow .t{ font-size:var(--fs-body); font-weight:500; line-height:1.5; padding-top:4px; }
    .flow .t b{ font-weight:800; color:var(--pr-deep); }
    .flow .done .n{ color:var(--mint-deep); }
    .flow .done .t{ color:var(--gray-700); }
    .flow .t .tip{ display:block; margin-top:2px; font-size:var(--fs-box-desc); font-weight:500; color:var(--gray-700); }
    .ck-list{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px; }
    .ck-list button{ display:grid; grid-template-columns:34px 1fr; gap:10px; align-items:start; width:100%; text-align:left; font:inherit; font-size:var(--fs-body); font-weight:600; line-height:1.45; color:var(--ink); background:none; border:0; padding:2px 0; cursor:pointer; }
    .ck-list .bx{ font-size:26px; line-height:1.1; color:var(--pr-deep); }
    .ck-list .done .t{ color:var(--gray-700); }
    .slide:not(.pr) .ck-list .bx{ color:var(--blue); }
    /* 타이머(표식 ③) — 분 값은 data-min. 눌러서 시작·멈춤, 0이 되면 끝 */
    .timer{ display:inline-flex; align-items:baseline; gap:14px; font:inherit; color:var(--ink); background:none; border:0; padding:0; cursor:pointer; }
    .timer .tv{ font-size:56px; font-weight:800; line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums; color:var(--pr-deep); }
    .timer .tl{ font-size:var(--fs-box-desc); font-weight:800; color:var(--gray-700); }
    .slide:not(.pr) .timer .tv{ color:var(--blue); }
    .timer.end .tv{ color:var(--red); }
    .timer.big .tv{ font-size:120px; }
    .timer.sm{ gap:10px; }                                   /* 제목 줄 오른쪽의 작은 타이머(W1 제안 반영) */
    .timer.sm .tv{ font-size:34px; }
    .timer.sm .tl{ font-size:17px; }
    /* [펼침] — 강사가 눌러서 공개하는 칸. <details>라 Enter/Space로 열린다. 닫힌 동안은 본문을 배치에서 뺀다 */
    .reveal{ position:relative; padding:0; }
    .reveal::before{ content:none; }
    .reveal:not([open]) > .reveal-body{ display:none; }    /* 이 줄이 없으면 Chromium이 닫힌 details 자식의 배치를 유지해 감사가 겹침 · 가려짐으로 잡는다(W2 실측) */
    .reveal > summary{ position:relative; z-index:0; display:inline-flex; align-items:baseline; gap:10px; padding:8px 20px; list-style:none; cursor:pointer; font-size:var(--fs-lead); font-weight:800; line-height:1.3; color:var(--pr-deep, var(--blue)); }
    .reveal > summary::after{ content:""; position:absolute; inset:0; z-index:-1; border-radius:999px; background:var(--pr-soft, var(--blue-soft)); }
    .reveal > summary::-webkit-details-marker{ display:none; }
    .reveal > summary::before{ content:"▸"; font-size:var(--fs-eyebrow); }
    .reveal[open] > summary::before{ content:"▾"; }
    .reveal > summary .hint{ font-size:var(--fs-box-desc); font-weight:500; color:var(--gray-700); }
    .reveal[open] > summary .hint{ display:none; }
    .reveal .reveal-body{ margin-top:10px; }
    .reveal .reveal-body p{ margin:0 0 8px; font-size:var(--fs-body); line-height:1.55; color:var(--ink); }
    /* 위에 겹쳐 뜨는 펼침 패널 — .reveal.pop. 폭은 style="--rw:740px". 흰 카드 + 그림자, 열린 동안만 자리를 차지한다 */
    .reveal.pop > .reveal-body{ position:absolute; left:0; top:100%; z-index:6; margin-top:10px; width:var(--rw,700px); padding:16px 20px; background:var(--t-card); border-radius:22px; box-shadow:var(--sh-pop); }
    /* 돌아가기·이동 버튼 — 주홍 면 알약(허용 박스 1) */
    .back{ font:inherit; font-size:var(--fs-body); font-weight:800; color:var(--ink); background:var(--pr-fill); border:0; border-radius:var(--r-pill); padding:12px 30px; cursor:pointer; transition:transform .3s cubic-bezier(.2,.8,.2,1); }
    .slide:not(.pr) .back{ background:var(--mint); }
    .back:hover, .back:focus-visible{ transform:translateY(-3px); }
    .back[hidden]{ display:none; }

    /* ── 9. 개념 위젯 공통(data-w="toggle|step|pick") — 조작 전 초기 상태는 마크업에 적힌 그대로 읽힌다 ── */
    [data-show]:not(.is-on){ display:none; }
    [data-pick], [data-set], [data-toggle], [data-next], [data-prev], [data-reset]{ cursor:pointer; }
    .wg-row{ display:flex; align-items:center; flex-wrap:wrap; gap:12px 22px; margin-top:10px; }
    .wg-row.top{ margin:0 0 14px; }          /* 조작 줄을 그림 위에 둔다 — 상태가 바뀌어 그림 높이가 달라져도 버튼 자리가 그대로다 */
    .wg-btn{ font:inherit; font-size:var(--fs-box-desc); font-weight:800; color:var(--white); background:var(--blue); border:0; border-radius:var(--r-pill); padding:9px 22px; cursor:pointer; transition:transform .25s cubic-bezier(.2,.8,.2,1); }
    .wg-btn:hover, .wg-btn:focus-visible{ transform:translateY(-2px); }
    .wg-btn[aria-pressed="true"]{ background:var(--mint); color:var(--on-mint); }
    .wg-link{ font:inherit; font-size:var(--fs-box-desc); font-weight:800; color:var(--blue); background:none; border:0; padding:4px 0; cursor:pointer; text-decoration:underline; text-underline-offset:4px; }
    .wg-link[aria-pressed="true"]{ color:var(--ink); }
    .wg-read{ margin:10px 0 0; min-height:2.9em; font-size:var(--fs-body); font-weight:700; line-height:1.45; color:var(--ink); }
    .wg-hint{ font-size:var(--fs-box-desc); font-weight:600; line-height:1.4; color:var(--gray-700); }

    /* ── 10. SVG 시각 자료 어휘 — viewBox 폭을 그려지는 폭에 가깝게 잡아(배율 ≥ 1) SVG 안 px가 실제 px가 되게 한다 ── */
    .v-ax{ font:700 17px/1 "Pretendard",sans-serif; fill:var(--gray-700); }
    .v-val{ font:800 26px/1 "Pretendard",sans-serif; fill:var(--ink); }
    .v-txt{ font:700 20px/1.3 "Pretendard",sans-serif; fill:var(--ink); }
    .v-txt-lg{ font:800 24px/1.3 "Pretendard",sans-serif; fill:var(--ink); }
    .v-note{ font:600 17px/1.3 "Pretendard",sans-serif; fill:var(--gray-700); }
    .v-mono{ font:700 18px/1.3 var(--font-mono); fill:var(--ink); }
    .v-axis{ stroke:var(--gray-400); stroke-width:2; fill:none; }
    .v-base{ stroke:var(--gray-700); stroke-width:2.5; stroke-dasharray:8 6; fill:none; }
    .v-edge{ stroke:var(--gray-700); stroke-width:2.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .v-edge.hi{ stroke:var(--blue); stroke-width:3; }
    .v-bar{ fill:var(--periwinkle); transition:fill .25s; }
    .v-bar.hi, .v-bar.is-on, [data-pick].on > .v-bar{ fill:var(--blue); }
    .v-bar.warn, [data-pick].on.warn > .v-bar{ fill:var(--coral); }
    .v-node{ fill:var(--white); stroke:var(--gray-400); stroke-width:2; transition:fill .25s, stroke .25s; }
    .v-node.is-on{ fill:var(--mint); stroke:var(--blue); }
    .v-node.hi{ fill:var(--blue-soft); stroke:var(--blue); }
    /* 위젯 표시 클래스 — data-from·data-hl 대상에 붙인다: w-in(켜지면 나타남) · w-dim(켜지면 흐려짐) */
    .w-in, [data-from]{ opacity:0; transition:opacity .25s; }
    .w-in.is-on, [data-from].is-on{ opacity:1; }
    .w-dim{ transition:opacity .25s; }
    .w-dim.is-on{ opacity:.3; }

    /* ══════════ F-cover · 표지 ══════════ 클래스: slide cover f-cover — 네 모서리가 안쪽으로 모인다(표지의 유일한 연출) */
    .f-cover{ background:var(--paper); padding:0; }
    .f-cover::before{ content:none; }                                   /* kit .cover의 점 격자를 끈다 */
    .f-cover .cv-h1{ margin:0; font-size:var(--fs-caption); letter-spacing:0; }   /* 글자는 sr-only라 14px로 둔다 — 32px 기본값은 자간 검사(≥32px)에 걸린다 */
    .f-cover .cv-word{ position:absolute; left:72px; top:206px; width:560px; height:auto; display:block; }
    .f-cover .cv-word .stroke{ fill:none; stroke:var(--blue); stroke-width:5; stroke-linejoin:miter; stroke-linecap:square; stroke-miterlimit:1.5; }
    .f-cover .cv-sub{ position:absolute; left:72px; top:470px; margin:0; font-size:var(--fs-40); font-weight:800; line-height:1.2; letter-spacing:-.03em; color:var(--ink); }
    .f-cover .cv-line{ position:absolute; left:74px; top:538px; margin:0; font-size:var(--fs-lead); font-weight:600; line-height:1.45; color:var(--gray-700); }
    .f-cover .cv-frame{ position:absolute; left:700px; top:112px; width:500px; height:500px; display:block; overflow:visible; }
    .f-cover .cv-frame .corner{ fill:none; stroke:var(--blue); stroke-width:14; stroke-linecap:square; }
    .f-cover .cv-frame .core{ fill:var(--mint); }
    @keyframes fr-corner{ from{ opacity:0; transform:translate(var(--dx,0),var(--dy,0)); } }
    .slide.is-active.f-cover .cv-frame .corner{ animation:fr-corner .6s cubic-bezier(.2,.8,.2,1) backwards; }

    /* ══════════ F-divider · 블록 간지 ══════════ 클래스: slide part-divider f-divider — 어두운 전면 + 여정 지도(.journey) */
    .f-divider, .slide.dark{ background:var(--t-dark); color:var(--white); }
    .f-divider .s-title, .slide.dark .s-title, .f-divider .dv-title{ color:var(--white); }
    .f-divider .kick, .slide.dark .kick, .f-divider .s-eyebrow, .slide.dark .s-eyebrow, .f-divider .dv-no{ color:var(--mint); }
    .f-divider .lede, .slide.dark .lede, .f-divider .dv-sub{ color:var(--t-dark-soft); }
    .f-divider .dv-corners{ position:absolute; left:0; top:0; width:1280px; height:720px; display:block; pointer-events:none; }
    .f-divider .dv-corners path{ fill:none; stroke:var(--t-dark-2); stroke-width:6; stroke-linecap:square; }
    .dv-wrap{ position:absolute; left:72px; right:72px; top:0; bottom:0; display:flex; flex-direction:column; justify-content:center; }
    .dv-no{ margin:0 0 12px; font-size:var(--fs-lead); font-weight:800; letter-spacing:.04em; line-height:1.2; color:var(--blue); }
    .dv-title{ margin:0; font-size:var(--fs-display-lg); font-weight:700; line-height:1.15; letter-spacing:-.04em; color:var(--ink); }
    .dv-sub{ margin:14px 0 0; max-width:900px; font-size:var(--fs-lead); font-weight:500; line-height:1.5; color:var(--gray-400); }
    .dv-bar{ display:block; width:100%; max-width:928px; height:auto; margin-top:56px; }
    .dv-bar .seg{ fill:var(--t-dark-2); }
    .dv-bar .seg.done{ fill:var(--t-dark-soft); }
    .dv-bar .seg.cur{ fill:var(--mint); }
    .dv-steps{ display:grid; grid-template-columns:repeat(4,1fr); column-gap:16px; width:100%; max-width:928px; margin:10px 0 0; padding:0; list-style:none; }
    .dv-steps li{ font-size:var(--fs-eyebrow); font-weight:700; line-height:1.3; color:var(--t-dark-soft); }
    .dv-steps li.cur{ font-weight:800; color:var(--white); }

    /* ══════════ F-hub · 에이전트 실습 허브 ══════════ 클래스: slide f-hub — 테두리 없는 파스텔 카드 네 장 */
    .hub-wrap, .slot-wrap, .cx-wrap{ position:absolute; left:72px; right:72px; top:56px; bottom:54px; display:flex; flex-direction:column; }
    .hub-top .s-title, .slot-top .s-title, .cx-top .s-title{ margin:8px 0 0; }
    .hub-lead{ margin:10px 0 0; font-size:var(--fs-lead); line-height:1.55; color:var(--gray-400); }
    .hub-grid{ flex:1 1 auto; min-height:0; margin-top:24px; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:20px; }
    .hub-card{ position:relative; z-index:0; display:grid; grid-template-columns:64px 1fr 132px; gap:18px; align-items:center; text-align:left; font:inherit; color:var(--ink);
      background:none; border:0; padding:0 26px 0 22px; cursor:pointer; transition:transform .3s cubic-bezier(.2,.8,.2,1); }
    .hub-card::before{ content:""; position:absolute; inset:0; z-index:-1; border-radius:26px; background:var(--tint,var(--t-mint)); transition:box-shadow .3s; }
    .hub-card{ --tint:var(--t-apricot); }   /* 네 실습 모두 실습 색 한 가지(색 순환 없음) */
    .hub-card:hover, .hub-card:focus-visible{ transform:translateY(-4px); }
    .hub-card:hover::before, .hub-card:focus-visible::before{ box-shadow:var(--sh-pop); }
    .hub-card[aria-disabled="true"]{ cursor:default; }
    .hub-card[aria-disabled="true"]:hover{ transform:none; }
    .hub-no{ font-size:60px; font-weight:800; line-height:1; color:var(--blue); letter-spacing:-.04em; text-align:center; }
    .hub-card.is-done .hub-no{ color:var(--mint-deep); }
    .hub-body{ display:flex; flex-direction:column; gap:6px; min-width:0; }
    .hub-name{ font-size:var(--fs-box-title); font-weight:800; line-height:1.3; letter-spacing:-.02em; }
    .hub-meta{ font-size:var(--fs-box-desc); font-weight:500; color:var(--gray-700); line-height:1.4; }
    .hub-meta b{ font-weight:800; color:var(--ink); }
    .hub-done{ display:none; font-size:var(--fs-box-desc); font-weight:800; color:var(--mint-deep); }
    .hub-card.is-done .hub-done{ display:block; }
    .hub-pic{ width:132px; height:64px; display:block; }
    .hub-pic .p-s{ fill:none; stroke:var(--gray-700); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    .hub-pic .p-f{ fill:var(--t-card); }
    .hub-pic .p-a{ fill:none; stroke:var(--blue); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    /* 실습 일곱 가지 — 4열 2행. 여덟째 칸은 안내와 「수업으로 돌아가기」 */
    .hub-grid.g7{ grid-template-columns:repeat(4,1fr); gap:14px; margin-top:16px; }
    .hub-grid.g7 .hub-card{ grid-template-columns:1fr; grid-template-rows:auto 1fr; gap:10px; padding:12px 12px 12px; align-items:start; }
    .hub-grid.g7 .hub-card img{ display:block; width:100%; height:132px; object-fit:cover; object-position:top left; border-radius:12px; box-shadow:var(--sh-card); }
    .hub-grid.g7 .hub-body{ gap:4px; padding:0 4px; }
    .hub-grid.g7 .hub-name{ font-size:22px; }
    .hub-grid.g7 .hub-no{ display:inline; margin-right:8px; font-size:22px; letter-spacing:0; }
    .hub-grid.g7 .hub-done{ position:absolute; top:18px; right:18px; padding:2px 10px; border-radius:var(--r-pill); background:var(--white); font-size:16px; }
    .hub-note{ display:flex; flex-direction:column; justify-content:center; align-items:flex-start; gap:14px; padding:0 8px; }
    .hub-note p{ margin:0; font-size:var(--fs-box-desc); font-weight:500; line-height:1.5; color:var(--gray-700); }
    .hub-note p b{ color:var(--ink); font-weight:800; }
    .slot-mini.m7{ gap:10px; }
    .slot-mini.m7 .mini-card{ grid-template-columns:34px 1fr; gap:10px; padding:13px 16px; }
    .slot-mini.m7 .mini-no{ font-size:28px; }
    .hub-foot{ display:flex; align-items:center; justify-content:space-between; gap:24px; margin-top:14px; min-height:52px; }
    .hub-foot p{ margin:0; font-size:var(--fs-body); font-weight:500; color:var(--gray-700); }
    .hub-foot p b{ color:var(--ink); font-weight:800; }

    /* ══════════ F-slot · 수업 안의 실습 시간 ══════════ 클래스: slide f-slot · data-return-to="R-A" */
    .slot-lead{ margin:10px 0 0; font-size:var(--fs-lead); line-height:1.55; color:var(--gray-400); }
    .slot-main{ flex:1 1 auto; min-height:0; margin-top:24px; display:grid; grid-template-columns:1fr 600px; column-gap:56px; align-items:center; }
    .slot-text{ display:flex; flex-direction:column; gap:26px; }
    .slot-mini{ position:relative; z-index:0; display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; padding:14px; font:inherit; color:var(--ink); background:none; border:0; cursor:pointer;
      transition:transform .3s cubic-bezier(.2,.8,.2,1); }
    .slot-mini::before{ content:""; position:absolute; inset:0; z-index:-1; border-radius:30px; background:var(--t-sky); }
    .slot-mini:hover, .slot-mini:focus-visible{ transform:translateY(-4px); }
    .mini-card{ position:relative; z-index:0; display:grid; grid-template-columns:48px 1fr; gap:14px; align-items:center; padding:26px 22px; text-align:left; }
    .mini-card::before{ content:""; position:absolute; inset:0; z-index:-1; border-radius:20px; background:var(--t-card); box-shadow:var(--sh-card); }
    .mini-no{ font-size:var(--fs-40); font-weight:800; line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums; color:var(--blue); text-align:center; }
    .mini-name{ font-size:var(--fs-box-desc); font-weight:700; line-height:1.3; }
    .mini-card.is-done .mini-no{ color:var(--mint-deep); }
    .mini-card.is-done .mini-name::after{ content:" ✓"; color:var(--mint-deep); }
    .slot-hint{ display:block; margin-top:14px; font-size:var(--fs-box-desc); font-weight:700; color:var(--gray-700); text-align:center; }

    /* ══════════ 실습 셸(F-pr-*·F-return) — 흰 바탕 + 살구 면(.bleed.t-apricot). 표식: 주홍 눈썹 「실습 N」 · 타이머 · 단계 번호 · 살구 면 ══════════ */
    .pr-wrap{ position:absolute; left:72px; right:72px; top:56px; bottom:54px; display:flex; flex-direction:column; }
    .pr-bar{ display:flex; align-items:baseline; gap:12px; min-height:30px; }
    .pr-no{ font-size:18px; font-weight:800; line-height:1.4; letter-spacing:.01em; color:var(--pr-deep); }   /* 표식 「실습 N」 라벨(눈썹) */
    .pr-name{ font-size:18px; font-weight:700; line-height:1.4; color:var(--gray-700); }
    .pr-name::before{ content:"·"; margin-right:12px; color:var(--gray-400); }
    .pr-steps{ margin-left:auto; display:flex; gap:6px; font-size:var(--fs-box-desc); font-weight:700; color:var(--gray-400); }
    .pr-steps span{ position:relative; z-index:0; padding:3px 14px; }
    .pr-steps .cur{ color:var(--ink); }
    .pr-steps .cur::before{ content:""; position:absolute; inset:0; z-index:-1; border-radius:999px; background:var(--pr-fill); }
    .pr-top .s-title{ margin:8px 0 0; }
    .pr-top.has-timer{ display:flex; align-items:flex-start; justify-content:space-between; gap:28px; }   /* 제목 줄 오른쪽에 작은 타이머(.timer.sm) */
    .pr-lead{ margin:10px 0 0; max-width:30em; font-size:var(--fs-lead); line-height:1.55; color:var(--gray-400); }
    .pr-main{ flex:1 1 auto; min-height:0; margin-top:24px; position:relative; display:flex; flex-direction:column; }
    .pr-cols{ --lc:540px; flex:1 1 auto; min-height:0; display:grid; grid-template-columns:var(--lc) 1fr; column-gap:40px; }
    .pr-left{ display:flex; flex-direction:column; justify-content:space-between; gap:16px; min-height:0; }
    .pr-right{ display:flex; flex-direction:column; gap:16px; min-height:0; }
    .pr-right .tail{ margin-top:auto; }
    .fx-back{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:24px; }   /* ④ 아래 줄: 안내 한 줄 + 허브로 단추 */

    /* F-pr-goal ① 목표 — 전후 미리보기 + 시간·준비물·결과물 */
    .pv{ flex:1 1 auto; display:grid; grid-template-columns:392px 96px 1fr; align-items:center; gap:12px; }
    .pv-before{ width:392px; height:250px; display:block; }
    .pv-before .sheet{ fill:var(--t-card); stroke:none; filter:drop-shadow(0 5px 8px var(--t-shadow)); }
    .pv-before .ln{ stroke:var(--t-memo); stroke-width:6; stroke-linecap:round; }
    .pv-before .ln.hot{ stroke:var(--pr-fill); }
    .pv-before .fn{ font:700 17px/1 "Pretendard",sans-serif; fill:var(--pr-deep); }
    .pv-arrow{ width:96px; height:40px; display:block; }
    .pv-arrow path{ fill:none; stroke:var(--pr-deep); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    .meta3{ margin:auto 0 0; display:grid; grid-template-columns:200px 1fr 1fr; gap:36px; }
    .meta3 > div{ position:relative; padding:0; }
    .meta3 dt{ font-size:17px; font-weight:800; line-height:1.3; color:var(--gray-400); }
    .meta3 dd{ margin:4px 0 0; font-size:var(--fs-body); font-weight:500; line-height:1.45; color:var(--ink); }
    .meta3 .big{ font-size:var(--fs-40); font-weight:800; line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums; color:var(--pr-deep); }

    /* F-pr-check ③ 확인 — 위쪽에 대조할 것(원문 창 + 결과 표 등), 아래쪽에 체크 목록 */
    .ck-top{ position:relative; flex:1 1 auto; display:grid; grid-template-columns:500px 1fr; column-gap:96px; align-items:center; }
    .ck-top > .win .win-body{ padding:4px 18px 12px; }
    .ck-top > .win .code{ line-height:1.5; }
    .ck-top{ margin-bottom:16px; }
    .ck-list.tail{ margin-top:auto; }
    .ck-link{ position:absolute; left:0; top:0; width:1280px; height:720px; pointer-events:none; }
    .ck-link path{ fill:none; stroke:var(--pr-deep); stroke-width:3; stroke-dasharray:7 5; }
    .ck-link circle{ fill:var(--pr-deep); }

    /* F-pr-fix ④ 고치기 · F-pr-list · F-pr-screen · F-return — .pr-cols 두 칸(--lc로 왼쪽 폭을 바꾼다) */
    .fx-lead{ margin:0; font-size:var(--fs-body); line-height:1.55; color:var(--ink); }
    .loc{ width:250px; height:330px; display:block; }
    .loc .page{ fill:var(--t-card); stroke:none; filter:drop-shadow(0 5px 8px var(--t-shadow)); }
    .loc .ln{ stroke:var(--t-memo); stroke-width:7; stroke-linecap:round; }
    .loc .ln.hot{ stroke:var(--pr-fill); stroke-width:9; }
    .loc .tick{ font:700 17px/1 "Pretendard",sans-serif; fill:var(--gray-700); }
    .loc .pin{ fill:var(--pr-deep); }
    .reveal-row{ display:grid; grid-template-columns:250px 1fr; gap:24px; align-items:start; }
    .resume{ margin-top:auto; }
    .resume p{ margin:0; font-size:var(--fs-body); line-height:1.5; }

    /* ══════════ F-concept-fig · 개념 장 틀 ══════════ 클래스: slide cx-slide — 정의 → 비유 → 대응(선 없이 라벨 + 글자 위계) + 시각 자료 자리 */
    .cx-main{ flex:1 1 auto; min-height:0; margin-top:26px; display:grid; grid-template-columns:470px 1fr; column-gap:44px; align-items:stretch; }
    .cx-text{ display:flex; flex-direction:column; gap:26px; }
    .cx-fig{ position:relative; z-index:0; margin:0; display:flex; flex-direction:column; justify-content:flex-start; padding:20px 28px 18px; }
    .cx-fig::before{ content:""; position:absolute; inset:0; z-index:-1; border-radius:26px; background:var(--t-card); box-shadow:var(--sh-card); }   /* 흰 카드 + 약한 그림자 — 면 대신 그림만 두려면 .bare */
    .cx-fig.bare{ padding:0; }
    .cx-fig.bare::before{ content:none; }
    .cx-fig svg{ display:block; width:100%; height:auto; }
    .cx-src{ margin:auto 0 0; display:flex; flex-wrap:wrap; gap:0 14px; font-size:var(--fs-caption); line-height:var(--lh-caption); color:var(--gray-400); }
    .cx-src span + span::before{ content:"·"; margin-right:14px; }   /* 출처·캡션은 요소 하나에 24자 이하 — 더 길면 22px(audit_typography 서술문 판정) */

    /* ══════════ 디자인 v2 클래스 — 면 · 띠 · 카드 · 큰 숫자 · 여정 지도 · 도트 · 도넛 ══════════
       면(배경색 · 그림자)은 전부 ::before 의사 요소로 그린다 — 박스 선 없이 면으로 구분하는 v2 규칙이고, audit_render.js가 box로 세지 않는다.
       (실제 bg를 가진 요소는 터미널 · 창 · 단추 · 알약 버튼처럼 박스 예산에 드는 것뿐이다.) */

    /* 틴트 색 — .t-* 를 면 · 띠 · 카드에 붙인다. 기본은 민트(실습 장은 살구) */
    .bleed, .band, .pc{ --tint:var(--t-mint); }
    :where(.slide.pr) .bleed, :where(.slide.pr) .band, :where(.slide.pr) .pc{ --tint:var(--t-apricot); }
    .t-mint{ --tint:var(--t-mint); } .t-sky{ --tint:var(--t-sky); } .t-apricot{ --tint:var(--t-apricot); } .t-mist{ --tint:var(--t-mist); } .t-lav{ --tint:var(--t-sky); } .t-sand{ --tint:var(--t-mist); }

    /* .bleed — 오른쪽 끝(위 · 아래 · 오른쪽)까지 닿는 옅은 면. 섹션 직속에 두고 그림은 .on-bleed 안에. 폭 .w40 · .w50(기본) · .w60 */
    .bleed{ position:absolute; top:0; right:0; bottom:0; width:50%; }
    .bleed::before{ content:""; position:absolute; inset:0; z-index:-1; background:var(--tint); }
    .bleed.w40{ width:40%; } .bleed.w50{ width:50%; } .bleed.w60{ width:60%; }
    .on-bleed{ position:absolute; top:0; right:0; bottom:0; width:50%; box-sizing:border-box; padding:56px 56px 72px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; }
    .bleed.w40 ~ .on-bleed, .on-bleed.w40{ width:40%; } .bleed.w60 ~ .on-bleed, .on-bleed.w60{ width:60%; }
    .bleed > .on-bleed{ inset:0; width:auto; }
    /* 면이 오른쪽에 있으면 제목 · 본문 칸은 왼쪽 나머지 폭 안에 둔다 */
    .slide:has(> .bleed.w40){ --tw:656px; } .slide:has(> .bleed.w50){ --tw:520px; } .slide:has(> .bleed.w60){ --tw:392px; }
    .slide:has(> .bleed) > :is(.kick, .s-title, .lede, .rule, .keep, .bignum, p, ul, ol, dl){ max-width:var(--tw); }

    /* .band — 화면 폭 옅은 띠(짧은 순서 · 요약 한 줄). 기본은 바닥 위 74px. style="--bb:auto;--bt:300px;--bh:140px"로 자리 · 높이를 바꾼다 */
    .band{ position:absolute; left:0; right:0; bottom:var(--bb,74px); top:var(--bt,auto); z-index:0; min-height:var(--bh,128px); box-sizing:border-box; padding:0 72px; display:flex; align-items:center; flex-wrap:wrap; gap:14px 22px; font-size:var(--fs-body); font-weight:600; color:var(--gray-700); }
    .band::before{ content:""; position:absolute; inset:0; z-index:-1; background:var(--tint); }

    /* .bignum — 초대형 숫자. 단위는 <small>. .md는 112px */
    .bignum{ margin:16px 0 0; font-size:170px; font-weight:800; line-height:1; letter-spacing:-.05em; font-variant-numeric:tabular-nums; color:var(--blue); }
    .bignum.md{ font-size:112px; }
    .bignum small{ font-size:.36em; font-weight:800; letter-spacing:-.03em; }
    .bignum.md small{ font-size:.4em; }
    .slide.pr .bignum{ color:var(--pr-deep); }
    .slide.dark .bignum{ color:var(--mint); }

    /* .ic — 흰 원 안 선 아이콘(.lg 96px · .fill 색 면 원) */
    .ic{ position:relative; z-index:0; display:grid; place-items:center; flex:none; width:64px; height:64px; }
    .ic::before{ content:""; position:absolute; inset:0; z-index:-1; border-radius:50%; background:var(--t-card); box-shadow:var(--sh-ic); }
    .ic svg{ width:32px; height:32px; stroke:var(--blue); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
    .slide.pr .ic svg{ stroke:var(--pr-deep); }
    .ic.lg{ width:96px; height:96px; } .ic.lg svg{ width:44px; height:44px; }
    .ic.fill::before{ background:var(--mint); } .ic.fill svg{ stroke:var(--on-mint); }
    .slide.pr .ic.fill::before{ background:var(--pr-fill); } .slide.pr .ic.fill svg{ stroke:var(--ink); }

    /* .pill — 알약 칩(단계 · 태그 · 「지금」). 기본은 어두운 페트롤, .m 민트 · .pr 주홍 · .ghost 윤곽 */
    .pill{ position:relative; z-index:0; display:inline-flex; border:0; background:none; box-shadow:none; align-items:center; gap:8px; padding:7px 16px; font-size:17px; font-weight:700; line-height:1.3; color:var(--white); white-space:nowrap; }
    .pill::before{ content:""; position:absolute; inset:0; z-index:-1; border-radius:999px; background:var(--t-dark); }
    .slide.dark .pill::before, .f-divider .pill::before{ background:var(--t-dark-2); }
    .pill.m{ color:var(--on-mint); } .pill.m::before{ background:var(--mint); }
    .pill.pr{ color:var(--ink); } .pill.pr::before{ background:var(--t-pr-fill); }
    .pill.ghost{ color:var(--ink); } .pill.ghost::before{ background:none; box-shadow:inset 0 0 0 2px var(--gray-400); }

    /* .pcards / .pc — 테두리 없는 파스텔 카드 2~4장 + 작은 아이콘. 색은 .t-* 로 바꾸고, 없으면 민트 · 하늘 · 라벤더 · 모래 순 */
    .pcards{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:20px; }
    .pc{ position:relative; z-index:0; padding:26px 26px 24px; display:flex; flex-direction:column; align-items:flex-start; gap:10px; }
    .pc::before{ content:""; position:absolute; inset:0; z-index:-1; border-radius:26px; background:var(--tint); }
    /* 카드 색 순환 없음(2026-10-01 사용자: 색 수 축소) — 같은 급 카드는 한 색. 구분이 필요하면 .t-* 로 한 장만 다르게 */
    .pc .ic{ margin-bottom:6px; }
    .pc b{ font-size:27px; font-weight:800; line-height:1.3; letter-spacing:-.02em; color:var(--ink); }
    .pc p{ margin:0; font-size:var(--fs-body); line-height:1.55; color:var(--gray-700); }

    /* .wcard — 흰 카드 + 약한 그림자(결과물 모형 · 표 · 화면 모형) */
    .wcard{ position:relative; z-index:0; padding:16px 20px; }
    .wcard::before{ content:""; position:absolute; inset:0; z-index:-1; border-radius:22px; background:var(--t-card); box-shadow:var(--sh-pop); }

    /* .paper — 살짝 기운 종이 메모(파일 이름 + 회색 줄). 전후 모형의 「전」. style="--r:-5deg" */
    .paper{ position:relative; z-index:0; width:170px; min-height:124px; box-sizing:border-box; padding:14px 16px; transform:rotate(var(--r,0deg)); }
    .paper::before{ content:""; position:absolute; inset:0; z-index:-1; border-radius:14px; background:var(--t-card); box-shadow:var(--sh-card); }
    .paper b{ display:block; font-size:16px; font-weight:700; line-height:1.3; color:var(--pr-deep, var(--blue)); }
    .paper i{ display:block; height:7px; margin-top:11px; border-radius:4px; background:var(--t-memo); }
    .paper i:nth-of-type(2){ width:78%; } .paper i:nth-of-type(3){ width:55%; }

    /* .toggles — 토글 목록 화면 모형(켜짐 .on / 꺼짐). 맡길 일 · 승인 */
    .toggles{ position:relative; z-index:0; list-style:none; margin:0; padding:8px 26px; width:min(100%,460px); }
    .toggles::before{ content:""; position:absolute; inset:0; z-index:-1; border-radius:24px; background:var(--t-card); box-shadow:var(--sh-pop); }
    .toggles li{ position:relative; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:16px 0; font-size:24px; font-weight:700; line-height:1.3; color:var(--ink); }
    .toggles li::before{ content:""; order:2; flex:none; width:58px; height:32px; border-radius:16px; background:var(--periwinkle); }
    .toggles li::after{ content:""; position:absolute; right:32px; top:50%; width:26px; height:26px; margin-top:-13px; border-radius:50%; background:var(--t-card); box-shadow:var(--sh-ic); }
    .toggles li.on::before{ background:var(--mint-deep); }
    .toggles li.on::after{ right:3px; }

    /* .cols-dot — 점 달린 단계 기둥(가로선 위 점 + 기둥별 목록) */
    .cols-dot{ position:relative; display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:28px; margin-top:40px; }
    .cols-dot::before{ content:""; position:absolute; left:6px; right:0; top:6px; height:2px; background:var(--blue-line-strong); }
    .cols-dot > div{ position:relative; }
    .cols-dot > div::before{ content:""; display:block; width:14px; height:14px; border-radius:50%; background:var(--blue); position:relative; }
    .cols-dot b{ display:block; margin:18px 0 12px; font-size:27px; font-weight:800; line-height:1.3; letter-spacing:-.02em; color:var(--ink); }
    .cols-dot b small{ display:block; margin-bottom:2px; font-size:16px; font-weight:800; letter-spacing:.02em; color:var(--gray-400); }
    .cols-dot ul{ margin:0; padding:0; list-style:none; font-size:var(--fs-body); line-height:1.7; color:var(--gray-700); }
    .cols-dot li::before{ content:""; display:inline-block; width:9px; height:9px; margin:0 10px 3px 0; border-radius:50%; background:var(--mint-deep); }
    .cols-dot li.a::before{ background:var(--mint); }
    .slide.pr .cols-dot > div::before{ background:var(--pr-deep); }
    .slide.pr .cols-dot li::before{ background:var(--pr-deep); } .slide.pr .cols-dot li.a::before{ background:var(--pr-fill); }

    /* .journey — 여정 지도(물결 길 + 단계 점 + 「지금」 표). 엔진이 길 · 점 · 자리를 만든다. JS 없이도 단계 이름이 한 줄로 읽힌다 */
    .journey{ --jr-road:var(--blue-panel-strong); --jr-on:var(--mint-line); --jr-done:var(--mint-deep); --jr-ring:var(--gray-400); --jr-ink:var(--gray-700); --jr-now-ink:var(--ink);
      position:relative; width:100%; min-height:120px; display:flex; justify-content:space-around; align-items:center; font-size:22px; font-weight:700; color:var(--jr-ink); }
    .journey.is-built{ display:block; aspect-ratio:1280/330; min-height:0; }
    .slide.dark .journey, .f-divider .journey{ --jr-road:var(--t-dark-2); --jr-on:var(--t-dark-3); --jr-done:var(--t-dark-soft); --jr-ring:var(--t-dark-soft); --jr-ink:var(--t-dark-ink); --jr-now-ink:var(--white); }
    .slide > .journey{ position:absolute; left:0; right:0; bottom:0; width:auto; }
    .slide > .journey.is-built{ height:330px; aspect-ratio:auto; }
    .jr-road{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
    .jr-road path{ fill:none; stroke-width:44px; stroke-linecap:round; vector-effect:non-scaling-stroke; }
    .jr-road .base{ stroke:var(--jr-road); } .jr-road .on{ stroke:var(--jr-on); }
    .jr-st{ position:absolute; width:0; height:0; }
    .jr-st .jr-d{ position:absolute; left:0; top:0; display:block; width:22px; height:22px; margin:-11px 0 0 -11px; overflow:visible; }
    .jr-st.now .jr-d{ width:60px; height:60px; margin:-30px 0 0 -30px; }
    .jr-d .ring{ fill:none; stroke:var(--jr-ring); stroke-width:4; } .jr-d .fill{ fill:var(--jr-done); } .jr-d .glow{ fill:var(--t-glow); } .jr-d .core{ fill:var(--mint); }
    .jr-st.next .fill, .jr-st.done .ring{ display:none; }
    .jr-st b{ position:absolute; left:0; top:26px; transform:translateX(-50%); font-size:22px; font-weight:700; line-height:1.3; color:var(--jr-ink); white-space:nowrap; }
    .jr-st.now b{ top:36px; color:var(--jr-now-ink); }
    .jr-tag{ position:absolute; z-index:0; transform:translate(-50%,-100%); padding:6px 14px; font-size:16px; font-weight:800; line-height:1.3; color:var(--on-mint); white-space:nowrap; }
    .jr-tag::before{ content:""; position:absolute; inset:0; z-index:-1; border-radius:999px; background:var(--mint); }

    /* .dotgrid(data-n · data-on) · .donut(data-v) — 검증 수치만. 엔진이 SVG를 그린다(초기 상태가 곧 완성본) */
    .dotgrid{ width:var(--dw,360px); }
    .dotgrid svg{ display:block; width:100%; height:auto; }
    .dotgrid .d{ fill:var(--blue-line); } .dotgrid .d.on{ fill:var(--blue); }
    .slide.pr .dotgrid .d{ fill:var(--pr-line); } .slide.pr .dotgrid .d.on{ fill:var(--pr-deep); }
    .donut{ position:relative; width:var(--dw,220px); aspect-ratio:1; display:grid; place-items:center; }
    .donut svg{ position:absolute; inset:0; width:100%; height:100%; }
    .donut .tr{ fill:none; stroke:var(--blue-line); stroke-width:14; } .donut .ar{ fill:none; stroke:var(--blue); stroke-width:14; }
    .slide.pr .donut .tr{ stroke:var(--pr-line); } .slide.pr .donut .ar{ stroke:var(--pr-deep); }
    .donut b{ position:relative; font-size:40px; font-weight:800; line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums; color:var(--ink); }

    /* .facts — 라벨 + 값 줄 목록(만들 것 · 준비물 · 시간). 면 · 선 없이 글자 위계만 */
    .facts{ margin:26px 0 0; display:grid; gap:14px; }
    .facts .f{ display:grid; grid-template-columns:88px 1fr; margin:0; }
    .facts dt{ padding-top:3px; font-size:17px; font-weight:800; line-height:1.4; color:var(--gray-400); }
    .facts dd{ margin:0; font-size:var(--fs-lead); font-weight:500; line-height:1.5; color:var(--ink); }

    /* ══════════ 2026-10 개편 — 개념 제목 · Color Hunt 화면 모형 · 링크 단추 ══════════ */
    /* 개념 제목: 개념어는 크게(색 글자), 뜻은 아랫줄에 작게. 「—」로 잇지 않는다 */
    .slide .s-title.term{ font-size:28px; font-weight:600; line-height:1.4; letter-spacing:-.02em; color:var(--gray-700); text-wrap:pretty; }
    .slide .s-title.term > .kw{ display:block; margin-bottom:2px; font-size:60px; font-weight:800; line-height:1.15; letter-spacing:-.04em; }
    a.back{ display:inline-block; }
    /* Color Hunt 화면 모형(DS-3) — 실제 화면 실측값: 팔레트 정사각형 · 줄 41/26/18/15% · 모서리 10px · 테두리 #ECECEC */
    .ch{ --ch-line:#ECECEC; --ch-ink:#1A1A1A; --ch-sub:#8F8F8F; --ch-on:#F2F2F2; background:var(--white); border-radius:18px; box-shadow:var(--sh-pop); overflow:hidden; color:var(--ch-ink); }
    .ch-top{ display:flex; align-items:center; gap:22px; height:54px; padding:0 18px; border-bottom:1px solid var(--ch-line); }
    .ch-logo{ display:flex; align-items:center; gap:9px; font-size:19px; font-weight:500; white-space:nowrap; }
    .ch-logo svg{ width:25px; height:29px; }
    .ch-search{ flex:1; display:flex; align-items:center; gap:8px; height:36px; padding:0 14px; border:1px solid var(--ch-line); border-radius:40px; font-size:14px; color:var(--ch-sub); }
    .ch-search svg, .ch-nav svg, .ch-like svg{ width:16px; height:16px; fill:none; stroke:var(--ch-ink); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .ch-url{ font-size:14px; font-weight:600; color:var(--ch-sub); }
    .ch-body{ display:grid; grid-template-columns:148px 1fr; }
    .ch-nav{ padding:12px 10px; display:flex; flex-direction:column; gap:2px; }
    .ch-nav b{ display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:10px; font-size:15px; font-weight:400; }
    .ch-nav b.on{ background:var(--ch-on); font-weight:500; }
    .ch-nav hr{ width:100%; border:0; border-top:1px solid var(--ch-line); margin:6px 0; }
    .ch-nav span{ padding:3px 12px; font-size:12px; line-height:1.5; color:var(--ch-sub); }
    .ch-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px 18px; padding:16px 20px 16px 10px; }
    .ch-pal{ aspect-ratio:1; border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
    .ch-pal i{ display:block; position:relative; width:100%; flex:none; }
    .ch-meta{ display:flex; justify-content:space-between; align-items:center; margin-top:9px; font-size:12px; color:var(--ch-ink); }
    .ch-like{ display:inline-flex; align-items:center; gap:7px; height:30px; padding:0 10px; border:1px solid var(--ch-line); border-radius:10px; font-size:13px; }

    /* ══════════ 표지 3D(f-cover3d) — 기둥 12개의 틀 + 아쿠아 정육면체 + 바닥 + 파일 카드. CSS 3D만 쓰고 빛 번짐 · 입자는 쓰지 않는다 ══════════ */
    .f-cover3d .cover-lead{ top:226px; font-size:20px; font-weight:800; color:var(--mint-deep); }
    .f-cover3d .cover-title{ top:260px; right:auto; }
    .cv-desc{ position:absolute; left:64px; top:412px; z-index:2; margin:0; max-width:540px; font-size:27px; font-weight:600; line-height:1.45; letter-spacing:-.02em; color:var(--gray-700); }
    .cv3d{ --b1:var(--blue); --b2:#2E7B8C; --b3:#08323D; position:absolute; right:64px; top:50px; width:620px; height:620px; z-index:2; perspective:2200px; cursor:grab; touch-action:none; user-select:none; }
    .cv3d.is-drag{ cursor:grabbing; }
    .cv3d-obj{ position:absolute; inset:0; transform-style:preserve-3d; transform:rotateX(-18deg) rotateY(32deg); }
    .cv3d-obj > *, .cv-core > i, .cv-beam > i{ position:absolute; left:50%; top:50%; }
    .cv-beam, .cv-core{ width:0; height:0; transform-style:preserve-3d; }
    .cv-beam > i{ width:316px; height:16px; margin:-8px 0 0 -158px; }
    .cv-beam .b1{ background:var(--b1); } .cv-beam .b2{ background:var(--b2); } .cv-beam .b3{ background:var(--b3); }
    .cv-glass{ width:284px; height:284px; margin:-142px 0 0 -142px; background:linear-gradient(135deg,rgba(125,224,236,.10),rgba(125,224,236,.02)); }
    .cv-solid{ width:100px; height:100px; margin:-50px 0 0 -50px; background:var(--mint); box-shadow:inset 0 0 0 2px rgba(255,255,255,.35); }
    .cv-solid.s2{ background:var(--mint-deep); } .cv-solid.s3{ background:#4FC4D4; } .cv-solid.s4{ background:#B8F0F6; }
    /* 바닥 — 틀 아래 누운 면: 부드러운 그림자와 점 격자 */
    .cv-ground{ width:520px; height:520px; margin:-260px 0 0 -260px; border-radius:50%; background:radial-gradient(closest-side,rgba(8,50,61,.22),rgba(8,50,61,.08) 45%,rgba(8,50,61,0) 72%); transform:translateY(236px) rotateX(90deg); }
    .cv-grid{ width:640px; height:640px; margin:-320px 0 0 -320px; border-radius:50%; transform:translateY(234px) rotateX(90deg);
      background-image:radial-gradient(circle,rgba(14,74,90,.34) 1.6px,transparent 2px); background-size:32px 32px; -webkit-mask-image:radial-gradient(closest-side,#000 30%,transparent 96%); mask-image:radial-gradient(closest-side,#000 30%,transparent 96%); }
    /* 파일 카드 — 그 파일의 내용을 본뜬 작은 화면 */
    .cv-card{ width:168px; box-sizing:border-box; padding:14px 16px 16px; border-radius:16px; background:var(--white); box-shadow:0 2px 0 rgba(8,50,61,.06), 0 14px 30px rgba(8,50,61,.18); }
    .cv-card b{ display:block; margin-bottom:10px; font-size:19px; font-weight:800; line-height:1.2; color:var(--blue); }
    .cv-card .row{ display:flex; align-items:center; gap:8px; margin-top:8px; }
    .cv-card .row i{ display:block; flex:1 1 auto; height:7px; border-radius:4px; background:var(--blue-panel); }
    .cv-card .ck{ flex:none; width:13px; height:13px; border-radius:4px; background:var(--mint-deep); }
    .cv-card .ck.off{ background:none; box-shadow:inset 0 0 0 2px var(--blue-line-strong); }
    .cv-card em{ flex:none; width:14px; font-style:normal; font-size:13px; font-weight:800; line-height:1; color:var(--mint-deep); }
    .cv-card .sw{ display:flex; height:26px; border-radius:8px; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(8,50,61,.10); }
    .cv-card .sw u{ display:block; }
    .cv-card.hot{ width:178px; background:#F7F4EA; } .cv-card.hot b{ color:var(--ink); }
    .cv-card .bar{ display:block; height:7px; border-radius:4px; background:rgba(31,78,95,.16); overflow:hidden; }
    .cv-card .bar u{ display:block; width:60%; height:100%; border-radius:4px; background:#1F4E5F; }
    .cv-card .opt{ display:block; height:20px; margin-top:8px; border-radius:7px; background:var(--white); }
    .cv-card .opt.on{ box-shadow:inset 0 0 0 2px #1F4E5F; }
    .cv-card .go{ display:block; height:22px; margin-top:10px; border-radius:7px; background:#F2A65A; }
