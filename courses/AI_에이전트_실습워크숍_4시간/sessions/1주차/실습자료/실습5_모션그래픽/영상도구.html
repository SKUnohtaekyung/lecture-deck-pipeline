■ 값은 한곳에
글꼴 굵기 2단계 · 글자 · 그림 · 도형 크기 단계 · 속도 기준값(경쾌하게)은 style 블록 맨 위 :root에 있습니다. 색은 장면 데이터의 색조합으로 고르므로 :root의 색(크림)은 바꾸지 않습니다.
그림 · 장식 · 도형의 색은 고른 색 조합의 3색과 그 농담뿐입니다. 포인트색은 면 · 선 · 어두운 바탕 위의 글자에 쓰이고, 밝은 바탕 위의 글자색으로는 대비가 모자랍니다.

⑦ 구간 순서(훅으로 시작 · 행동 안내로 끝) ⑧ 근거 칸 ⑨ 도구에 없는 이름 ⑩ 값의 형식 ⑪ 화면 넘침 ⑫ 도구 코드 그대로
⑬ 그림 · 도형 · 막대 · 장식이 하나도 없는 장면 ⑭ 도구에 없는 그림 · 장식 이름 ⑮ 한 장면에 그림 · 도형이 4개 넘음
⑯ 도구에 없는 색 조합 · 분위기 · 전환 이름 ⑰ 색 대비 4.5:1 미만. 판정하지 못한 항목은 「미판정」으로 따로 셉니다.

    items.forEach(function(o){ if (!o.n && !o.fail.length && !o.skip.length) o.skip.push('판정할 대상이 없었습니다'); });   /* 대상 0건은 통과가 아니라 미판정 */
    return items;
  }
  function verdict(o){ return o.fail.length ? '고칠 곳' : (o.skip.length ? '미판정' : '통과'); }
  function summarize(items){
    var c = { '고칠 곳':0, '통과':0, '미판정':0 };
    items.forEach(function(o){ c[verdict(o)]++; });
    return c;
  }
  function reportText(items){
    var c = summarize(items), out = ['영상도구 점검 결과 — 고칠 곳 ' + c['고칠 곳'] + ' · 통과 ' + c['통과'] + ' · 미판정 ' + c['미판정'] + ' (총 ' + items.length + '개 항목)'];
    ['고칠 곳', '미판정', '통과'].forEach(function(v){
      items.filter(function(o){ return verdict(o) === v; }).forEach(function(o){
        out.push('[' + v + '] ' + o.no + ' ' + o.name + ' — 판정 ' + o.n + '건 · 미판정 ' + o.skip.length + '건');
        o.fail.forEach(function(m){ out.push('  - ' + m); });
        o.skip.forEach(function(m){ out.push('  - (미판정) ' + m); });
      });
    });
    return out.join('\n');
  }
  function renderChecks(items){
    var c = summarize(items), sum = $('summary');
    sum.textContent = '';
    $('checks').textContent = '';
    if (!items.length){
      sum.appendChild(h('span', '고칠', '점검하지 못했습니다. 위쪽 오류 내용을 확인합니다'));
      document.documentElement.setAttribute('data-점검', '점검하지 못함');
      document.title = (M.title || '영상도구') + ' · 점검하지 못함';
      return '점검하지 못함';
    }
    sum.appendChild(h('span', '고칠', '고칠 곳 ' + c['고칠 곳']));
    sum.appendChild(h('span', '통과', '통과 ' + c['통과']));
    sum.appendChild(h('span', '미판정', '미판정 ' + c['미판정']));
    sum.appendChild(h('span', '흐림', '(총 ' + items.length + '개 항목)'));
    var ul = $('checks'); ul.textContent = '';
    items.forEach(function(o){
      var v = verdict(o), li = h('li', '항목 ' + (v === '고칠 곳' ? '고칠' : v));
      var line = h('div', '줄'); line.appendChild(h('span', '칩', v)); line.appendChild(h('b', '', o.no + ' ' + o.name)); li.appendChild(line);
      li.appendChild(h('p', '기준', o.rule));
      if (o.fail.length || o.skip.length){
        var ml = h('ul', '건');
        o.fail.forEach(function(m){ ml.appendChild(h('li', '', m)); });
        o.skip.forEach(function(m){ ml.appendChild(h('li', '', '미판정: ' + m)); });
        li.appendChild(ml);
      }
      li.appendChild(h('p', '수', '판정 ' + o.n + '건 · 미판정 ' + o.skip.length + '건'));
      ul.appendChild(li);
    });
    var head = '고칠 곳 ' + c['고칠 곳'] + ' · 통과 ' + c['통과'] + ' · 미판정 ' + c['미판정'];
    document.documentElement.setAttribute('data-점검', head);
    document.title = (M.title || '영상도구') + ' · ' + head;
    return head;
  }
  function renderErrors(){
    var box = $('errBox'); box.textContent = '';
    var msgs = [];
    if (!RAW || typeof RAW !== 'object') msgs.push('장면 데이터를 읽지 못했습니다. 「여기만 고칩니다」 구간의 쉼표 · 따옴표 · 괄호와, 첫 줄 window.영상 = { 가 그대로 있는지 확인합니다.');
    else if (!Array.isArray(RAW.장면)) msgs.push('window.영상 안에 장면 목록(장면: [ ... ])이 없습니다.');
    읽기오류.forEach(function(m){ msgs.push('브라우저가 알려 준 오류: ' + m); });
    var se = $('stageErr'); se.textContent = ''; se.style.display = msgs.length ? 'block' : 'none';
    if (msgs.length){
      var d = h('div', '오류상자');
      msgs.forEach(function(m){ d.appendChild(h('div', '', m)); se.appendChild(h('div', '', m)); });
      box.appendChild(d);
    }
    return msgs;
  }

  /* ── 장면표 · 근거 ── */
  function shownTime(s){
    var m = s.시작 + TRANS;
    s.els.forEach(function(e){ m = Math.max(m, e.abs + e.total); });
    return Math.min(m, s.끝 - 0.02);
  }
  function visualNames(s){
    var a = [];
    s.els.forEach(function(e){
      if (e.종류 === '그림') a.push('그림 ' + e.이름);
      else if (e.종류 === '그림줄') a.push('그림줄 ' + e.이름들.join('·'));
      else if (VISUAL.indexOf(e.종류) >= 0) a.push(e.종류);
    });
    s.decoNames.forEach(function(d){ a.push('장식 ' + d); });
    return a.join(' · ');
  }
  function renderRows(){
    rowsEl.textContent = '';
    M.scenes.forEach(function(s){
      var b = h('button', '행'); b.type = 'button';
      b.appendChild(h('span', '번호', (s.i + 1) + '. ' + (s.구간 || s.구간원문 || '구간 없음') + ' · ' + g(s.시작) + '~' + g(s.끝) + '초'));
      var texts = s.els.map(function(e){ return (e.글 + (e.곁글 ? ' ' + e.곁글 : '') + (e.글들.length ? ' ' + e.글들.join(' ') : '')).replace(/\n/g, ' ').trim(); }).filter(Boolean);
      var mos = []; s.els.forEach(function(e){ if (mos.indexOf(e.움직임) < 0) mos.push(e.움직임); });
      [['화면 글자', texts.join(' / ')], ['그림 · 장식', visualNames(s)], ['자막', s.자막], ['움직임', mos.join(' · ')], ['근거', s.근거]].forEach(function(p){
        var row = h('div', '칸'); row.appendChild(h('span', '', p[0])); row.appendChild(h('span', '', p[1] || '(없음)')); b.appendChild(row);
      });
      b.addEventListener('click', function(){ setPlaying(false); draw(shownTime(s)); });
      rowsEl.appendChild(b);
    });
  }

  /* ── 그림 · 장식 보기 ── */
  var KIND_NOTE = { '그림':'선 그림 한 개. 크기 · 원배지 선택', '그림줄':'그림 2~5개를 한 줄에. 차례로 나옴', '도넛':'비율 고리. 값은 비율, 글은 가운데 숫자', '별점':'별 5개 중 값만큼 채움',
    '카드':'둥근 상자 안에 글 + 곁글, 이름을 주면 그림도 넣음', '말풍선':'후기 인용. 곁글은 출처', '가격표':'이름(글)과 가격(곁글) 한 쌍', '큰도형':'원 · 둥근네모 · 알약 가운데 글자', '막대':'비율 막대' };
  function renderGallery(){
    var g2 = $('viewGallery'); g2.textContent = '';
    g2.appendChild(h('p', '흐림', '이름을 누르면 복사됩니다. 에이전트에게 이름으로 시킵니다. 예: 3장면 위쪽에 장바구니 그림을 크게 넣어 줘. 색 조합 · 분위기 · 전환은 누르면 이 화면에서 미리 적용됩니다.'));
    var pv = h('div', '미리보기줄'); pv.id = 'galPrev'; pv.hidden = true; pv.appendChild(h('span', '', ''));
    var pvb = h('button', 'btn sm', '미리보기 끝내기'); pvb.type = 'button'; pvb.addEventListener('click', function(){ PREVIEW.combo = PREVIEW.mood = PREVIEW.trans = null; applyPreview(); });
    pv.appendChild(pvb); g2.appendChild(pv);
    var msg = h('p', '흐림', ''); msg.id = 'galMsg'; msg.setAttribute('aria-live', 'polite'); msg.style.minHeight = '1.5em'; g2.appendChild(msg);
    g2.appendChild(h('h3', '갤러리제목', '그림 ' + ICON_NAMES.length + '개'));
    var grid = h('div', '그리드');
    ICON_NAMES.forEach(function(nm){
      var b = h('button', '셀'); b.type = 'button'; b.setAttribute('data-그림', nm); b.appendChild(iconSvg(nm).svg); b.appendChild(h('span', '', nm));
      b.addEventListener('click', function(){ copyText(nm, msg, '「' + nm + '」 이름을 복사했습니다'); });
      grid.appendChild(b);
    });
    g2.appendChild(grid);
    g2.appendChild(h('h3', '갤러리제목', '장식 ' + DECO_NAMES.length + '개 (장면에 하나 또는 둘)'));
    var grid2 = h('div', '그리드');
    DECO_NAMES.forEach(function(nm){
      var b = h('button', '셀'); b.type = 'button'; b.setAttribute('data-장식', nm);
      var box = h('span', '미리'); box.appendChild(decoNode(nm, 0)); b.appendChild(box); b.appendChild(h('span', '', nm));
      b.addEventListener('click', function(){ copyText(nm, msg, '「' + nm + '」 이름을 복사했습니다'); });
      grid2.appendChild(b);
    });
    g2.appendChild(grid2);
    g2.appendChild(h('h3', '갤러리제목', '색 조합 ' + COMBO_NAMES.length + '벌 (영상 전체에 하나 · 누르면 미리 적용)'));
    var gridC = h('div', '그리드');
    COMBO_NAMES.forEach(function(nm){
      var c = COMBOS[nm], b = h('button', '셀 색'); b.type = 'button'; b.setAttribute('data-색조합', nm);
      var bar = h('span', '칩줄'); [c.배경, c.글자, c.포인트].forEach(function(col){ var i = h('i'); i.style.background = col; bar.appendChild(i); });
      b.appendChild(bar); b.appendChild(h('span', '', nm)); b.appendChild(h('span', '흐림', contrast(c.글자, c.배경).toFixed(1) + ' · ' + contrast(c.글자, c.포인트).toFixed(1)));
      b.addEventListener('click', function(){ PREVIEW.combo = nm; applyPreview(); copyText(nm, msg, '「' + nm + '」 이름을 복사했습니다'); });
      gridC.appendChild(b);
    });
    g2.appendChild(gridC);
    g2.appendChild(h('h3', '갤러리제목', '분위기 ' + MOOD_NAMES.length + '개 (속도 · 가감속 · 튐을 한 번에)'));
    MOOD_NAMES.forEach(function(nm){
      var m = MOODS[nm], b = h('button', '목록행'); b.type = 'button'; b.setAttribute('data-분위기', nm);
      b.appendChild(h('b', '', nm));
      b.appendChild(h('span', '', '속도 ' + SPEEDS.map(function(sp){ return g(SPEED_BASE[sp] * m.배율); }).join(' · ') + '초 · 전환 ' + g(m.전환) + '초 · ' + m.설명));
      b.addEventListener('click', function(){ PREVIEW.mood = nm; applyPreview(); copyText(nm, msg, '「' + nm + '」 이름을 복사했습니다'); });
      g2.appendChild(b);
    });
    g2.appendChild(h('h3', '갤러리제목', '전환 ' + TRANSITIONS.length + '개 (영상 전체에 하나)'));
    TRANSITIONS.forEach(function(nm){
      var b = h('button', '목록행'); b.type = 'button'; b.setAttribute('data-전환', nm);
      b.appendChild(h('b', '', nm)); b.appendChild(h('span', '', TRANS_NOTE[nm]));
      b.addEventListener('click', function(){ PREVIEW.trans = nm; applyPreview(); if (M.scenes.length > 1){ draw(Math.max(0, M.scenes[1].시작 - .3)); setPlaying(true); } copyText(nm, msg, '「' + nm + '」 이름을 복사했습니다'); });
      g2.appendChild(b);
    });
    g2.appendChild(h('h3', '갤러리제목', '도형과 그림 종류'));
    Object.keys(KIND_NOTE).forEach(function(k){
      var row = h('div', '종류행'); row.appendChild(h('b', '', k)); row.appendChild(document.createTextNode(KIND_NOTE[k] + ' — ' + KINDMOTION[k].join(' · ')));
      g2.appendChild(row);
    });
  }
  function showTab(which){
    var g2 = which === 'gallery';
    $('viewCheck').hidden = g2; $('viewGallery').hidden = !g2;
    $('tabCheck').classList.toggle('on', !g2); $('tabGallery').classList.toggle('on', g2);
    $('tabCheck').setAttribute('aria-selected', String(!g2)); $('tabGallery').setAttribute('aria-selected', String(g2));
  }

  /* ── 재생 · 조작 ── */
  var raf = 0;
  function setPlaying(on){
    playing = on;
    playBtn.textContent = on ? '❚❚ 멈춤' : (cur >= M.dur ? '⟲ 다시 보기' : '▶ 재생');
    playBtn.setAttribute('aria-label', on ? '멈춤' : '재생');
    cancelAnimationFrame(raf);
    if (on){ last = performance.now(); raf = requestAnimationFrame(tick); }
  }
  function tick(now){
    if (!playing) return;
    draw(cur + Math.min(.25, (now - last) / 1000)); last = now;
    if (cur >= M.dur){ setPlaying(false); return; }
    raf = requestAnimationFrame(tick);
  }
  function toggle(){ if (!playing && cur >= M.dur) draw(0); setPlaying(!playing); }
  function jumpScene(dir){
    if (!M.scenes.length) return;
    var k = sceneAt(cur), target;
    if (dir < 0) target = (cur - M.scenes[k].시작 > .6 || k === 0) ? M.scenes[k].시작 : M.scenes[k - 1].시작;
    else target = k < M.scenes.length - 1 ? M.scenes[k + 1].시작 : M.dur;
    draw(target); setPlaying(playing && target < M.dur);
  }
  function fit(){
    var w = viewport.clientWidth - 24, hh = viewport.clientHeight - 24, k = Math.max(.05, Math.min(w / 1080, hh / 1920));
    frame.style.width = (1080 * k) + 'px'; frame.style.height = (1920 * k) + 'px'; stage.style.transform = 'scale(' + k + ')';
  }

  playBtn.addEventListener('click', toggle);
  $('replay').addEventListener('click', function(){ draw(0); setPlaying(true); });
  $('prev').addEventListener('click', function(){ jumpScene(-1); });
  $('next').addEventListener('click', function(){ jumpScene(1); });
  seek.addEventListener('input', function(){ setPlaying(false); draw(+seek.value); });
  $('cc').addEventListener('click', function(e){
    var on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
    e.currentTarget.setAttribute('aria-pressed', String(on)); stage.classList.toggle('자막끔', !on);
  });
  $('fs').addEventListener('click', function(){
    if (document.fullscreenElement) document.exitFullscreen(); else if (player.requestFullscreen) player.requestFullscreen();
  });
  $('panelBtn').addEventListener('click', function(){ app.classList.toggle('panel-open'); });
  $('panelClose').addEventListener('click', function(){ app.classList.remove('panel-open'); });
  document.addEventListener('fullscreenchange', fit);
  document.addEventListener('keydown', function(e){
    if (e.target && e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
    if (e.key === ' ' || e.key === 'k'){ e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight'){ setPlaying(false); draw(cur + 1); }
    else if (e.key === 'ArrowLeft'){ setPlaying(false); draw(cur - 1); }
    else if (e.key === 'Home'){ draw(0); }
  });
  window.addEventListener('resize', fit);

  /* ── 복사 ── */
  var report = null, reportItems = [];
  function copyText(text, msgEl, okMsg){
    function ok(){ msgEl.textContent = okMsg; setTimeout(function(){ msgEl.textContent = ''; }, 2000); }
    function fallback(){
      var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); ok(); } catch (err) { msgEl.textContent = '복사하지 못했습니다'; }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
  }
  $('copyReport').addEventListener('click', function(){ copyText(reportText(reportItems), $('copyMsg'), '복사했습니다'); });
  $('tabCheck').addEventListener('click', function(){ showTab('check'); });
  $('tabGallery').addEventListener('click', function(){ showTab('gallery'); });

  /* ── 시작 ── */
  function refresh(){
    fit();
    try {
      if (M.scenes.length) fitAll();
      reportItems = runChecks();
    } catch (err) {
      읽기오류.push('점검 중 오류: ' + err.message);
      reportItems = [];
    }
    report = renderChecks(reportItems);
  }
  var PREVIEW = { combo:null, mood:null, trans:null };
  function applyPreview(){
    applyAll(PREVIEW.combo ? COMBOS[PREVIEW.combo] : DATA.combo.색, PREVIEW.mood || DATA.mood, PREVIEW.trans || DATA.trans);
    recomputeTimes();
    draw(cur);
    var on = !!(PREVIEW.combo || PREVIEW.mood || PREVIEW.trans), box = $('galPrev');
    if (box){ box.hidden = !on; box.firstChild.textContent = '미리보기 중: ' + (PREVIEW.combo || DATA.combo.이름) + ' · ' + (PREVIEW.mood || DATA.mood) + ' · ' + (PREVIEW.trans || DATA.trans) + '. 파일은 바뀌지 않습니다.'; }
  }
  try {
    applyAll(DATA.combo.색, DATA.mood, DATA.trans);
    normalize(); build(); renderRows();
  } catch (err) {
    읽기오류.push('화면을 만드는 중 오류: ' + err.message);
    M.scenes = []; M.dur = 1;
  }
  renderGallery();
  refresh();
  renderErrors();
  console.info('[영상도구 점검] ' + report);
  reportItems.forEach(function(o){ if (verdict(o) !== '통과') console.info('  ' + o.no + ' ' + o.name + ' — ' + verdict(o) + ' ' + o.fail.concat(o.skip).length + '건'); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ var keep = cur; refresh(); draw(keep); renderErrors(); });

  window.영상도구 = { 그리기:draw, 점검:function(){ return { 요약:summarize(reportItems), 항목:reportItems.map(function(o){ return { 번호:o.no, 이름:o.name, 판정:verdict(o), 건:o.n, 고칠:o.fail.slice(), 미판정:o.skip.slice() }; }), 글:reportText(reportItems) }; },
                    길이:function(){ return M.dur; }, 현재:function(){ return cur; }, 모델:M, 목록:{ 그림:ICON_NAMES.slice(), 장식:DECO_NAMES.slice(), 종류:KINDS.slice(), 색조합:COMBO_NAMES.slice(), 분위기:MOOD_NAMES.slice(), 전환:TRANSITIONS.slice() }, 설정:function(){ return { 색조합:DATA.combo.이름, 분위기:DATA.mood, 전환:DATA.trans }; }, 미리보기:function(c, m, t){ PREVIEW.combo = c || null; PREVIEW.mood = m || null; PREVIEW.trans = t || null; applyPreview(); } };

  var q = /[?&]t=([\d.]+)/.exec(location.search);
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  draw(q ? +q[1] : 0);
  setPlaying(false);
  if (!q && !/[?&]paused\b/.test(location.search) && !reduce && M.scenes.length) setPlaying(true);
})();
</script>
</body>
</html>
