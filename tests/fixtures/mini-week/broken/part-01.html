<!--
  고장 변형 — R-PART-02(PART 정합) FAIL 재현용.
  정상 part-01.html과 같지만, 본문 슬라이드의 .s-team 라벨이 "PART 3"이다.
  이 슬라이드들은 첫 번째 divider 뒤에 있으므로 기대 위치 인덱스는 1 — 불일치 FAIL이 나야 한다.
  (계획 §18.2의 스케치는 "divider 순서 P1→P3"이었으나, 그 형태는 divider 단조 증가 검사를
   통과해 버려 라벨 정합 FAIL을 재현하지 못한다. 재현하려는 결함은 라벨 불일치이므로
   라벨 쪽을 틀리게 둔다.)
-->
